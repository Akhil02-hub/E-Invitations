<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Bonds — Wedding Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0612;
            font-family: 'Cormorant Garamond', serif
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1
        }

        #ui {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 36px
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start
        }

        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            color: #f5d78e;
            text-shadow: 0 0 30px rgba(245, 215, 142, .4);
            letter-spacing: 1px
        }

        .hint {
            font-family: 'Montserrat', sans-serif;
            font-size: .7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(245, 215, 142, .55);
            font-weight: 300;
            margin-top: 8px
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap
        }

        .btn {
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid rgba(245, 215, 142, .35);
            background: rgba(20, 12, 30, .55);
            backdrop-filter: blur(12px);
            color: #f5d78e;
            font-family: 'Montserrat', sans-serif;
            font-size: .68rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 12px 28px;
            border-radius: 2px;
            transition: all .4s cubic-bezier(.22, 1, .36, 1);
            outline: none
        }

        .btn:hover {
            background: rgba(245, 215, 142, .15);
            border-color: rgba(245, 215, 142, .7);
            box-shadow: 0 0 24px rgba(245, 215, 142, .2);
            transform: translateY(-2px)
        }

        .btn.active {
            background: rgba(245, 215, 142, .2);
            border-color: #f5d78e
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #0a0612;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .8s ease, visibility .8s
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 1.5px solid rgba(245, 215, 142, .15);
            border-top-color: #f5d78e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px
        }

        .loader-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #f5d78e;
            opacity: .8
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 6, 18, .75) 100%)
        }

        .grain {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: .04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading Invitation</div>
    </div>
    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div id="ui">
        <div class="top-bar">
            <div>
                <div class="logo">Eternal Bonds</div>
                <div class="hint">Drag to explore · Scroll to zoom</div>
            </div>
        </div>
        <div class="bottom-bar">
            <button class="btn" id="btn-open">Open Card</button>
            <button class="btn" id="btn-spin">Auto Spin</button>
            <button class="btn" id="btn-reset">Reset View</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0612, 0.018);

            const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
            camera.position.set(0, 1.8, 9.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 5;
            controls.maxDistance = 18;
            controls.maxPolarAngle = Math.PI * 0.72;
            controls.minPolarAngle = Math.PI * 0.2;
            controls.target.set(0, 0.3, 0);
            controls.autoRotate = false;
            controls.autoRotateSpeed = 0.6;

            /* --- Lighting --- */
            scene.add(new THREE.AmbientLight(0x2a1a3a, 0.55));

            const keyLight = new THREE.DirectionalLight(0xffe8c0, 1.4);
            keyLight.position.set(5, 10, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(2048, 2048);
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 40;
            keyLight.shadow.camera.left = -10;
            keyLight.shadow.camera.right = 10;
            keyLight.shadow.camera.top = 10;
            keyLight.shadow.camera.bottom = -10;
            keyLight.shadow.bias = -0.0003;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xc8a0ff, 0.45);
            fillLight.position.set(-6, 4, -4);
            scene.add(fillLight);

            const rimLight = new THREE.PointLight(0xf5d78e, 1.8, 20);
            rimLight.position.set(0, 3, -3);
            scene.add(rimLight);

            const softGlow = new THREE.PointLight(0xff9ec8, 0.6, 15);
            softGlow.position.set(-2, 1, 4);
            scene.add(softGlow);

            /* --- Card --- */
            const cardGroup = new THREE.Group();
            scene.add(cardGroup);
            const CARD_W = 4.2, CARD_H = 5.8, CARD_D = 0.06;

            /* --- Texture helpers --- */
            function createPaperTexture(w, h, opts = {}) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                ctx.fillStyle = opts.bg || '#faf6f0';
                ctx.fillRect(0, 0, w, h);
                const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.7);
                g.addColorStop(0, 'rgba(255,250,240,0.3)');
                g.addColorStop(1, 'rgba(200,180,150,0.15)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, w, h);
                for (let i = 0; i < 8000; i++) {
                    const x = Math.random() * w, y = Math.random() * h;
                    ctx.fillStyle = `rgba(120,90,50,${Math.random() * 0.06})`;
                    ctx.fillRect(x, y, 1.2, 1.2);
                }
                if (opts.border) {
                    ctx.strokeStyle = opts.borderColor || '#c9a84c';
                    ctx.lineWidth = opts.borderWidth || 8;
                    const m = opts.borderMargin || 40;
                    ctx.strokeRect(m, m, w - m * 2, h - m * 2);
                    ctx.lineWidth = 2;
                    const m2 = m + 16;
                    ctx.strokeRect(m2, m2, w - m2 * 2, h - m2 * 2);
                }
                if (opts.ornament) {
                    ctx.strokeStyle = '#c9a84c';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.7;
                    drawOrnament(ctx, w / 2, opts.ornamentY || 120, opts.ornamentScale || 1);
                    ctx.globalAlpha = 1;
                }
                if (opts.lines) {
                    opts.lines.forEach(l => {
                        ctx.font = l.font;
                        ctx.fillStyle = l.color || '#3a2a1a';
                        ctx.textAlign = l.align || 'center';
                        ctx.textBaseline = 'middle';
                        ctx.globalAlpha = l.alpha || 1;
                        ctx.fillText(l.text, l.x !== undefined ? l.x : w / 2, l.y);
                        ctx.globalAlpha = 1;
                    });
                }
                if (opts.flourish) {
                    ctx.strokeStyle = '#c9a84c';
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.55;
                    drawFlourish(ctx, w / 2, opts.flourishY, opts.flourishW || 180);
                    ctx.globalAlpha = 1;
                }
                const tex = new THREE.CanvasTexture(c);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                tex.encoding = THREE.sRGBEncoding;
                return tex;
            }
            function drawOrnament(ctx, cx, cy, s) {
                ctx.beginPath();
                for (let i = 0; i <= 60; i++) {
                    const t = i / 60 * Math.PI * 2;
                    const r = 18 * s * (1 + 0.35 * Math.sin(t * 6));
                    const x = cx + Math.cos(t) * r;
                    const y = cy + Math.sin(t) * r * 0.7;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, 6 * s, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 40 * s, cy); ctx.lineTo(cx - 22 * s, cy);
                ctx.moveTo(cx + 22 * s, cy); ctx.lineTo(cx + 40 * s, cy);
                ctx.stroke();
            }
            function drawFlourish(ctx, cx, cy, w) {
                ctx.beginPath();
                ctx.moveTo(cx - w / 2, cy);
                ctx.bezierCurveTo(cx - w / 4, cy - 18, cx - w / 8, cy + 12, cx, cy);
                ctx.bezierCurveTo(cx + w / 8, cy - 12, cx + w / 4, cy + 18, cx + w / 2, cy);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            /* --- Textures --- */
            const coverTex = createPaperTexture(1024, 1408, {
                bg: '#f7f0e6',
                border: true, borderColor: '#c9a84c', borderWidth: 10, borderMargin: 48,
                ornament: true, ornamentY: 280, ornamentScale: 1.4,
                flourish: true, flourishY: 980, flourishW: 260,
                lines: [
                    { text: 'You\'re Invited', font: 'italic 52px "Cormorant Garamond"', color: '#8b7355', y: 420, alpha: 0.85 },
                    { text: 'Sophia & James', font: '120px "Great Vibes"', color: '#2c1810', y: 600 },
                    { text: 'to celebrate their wedding', font: 'italic 36px "Cormorant Garamond"', color: '#6b5535', y: 720 },
                    { text: 'June 14, 2025', font: '600 40px "Cormorant Garamond"', color: '#c9a84c', y: 860 },
                    { text: '✦', font: '28px serif', color: '#c9a84c', y: 1080 }
                ]
            });

            const insideLeftTex = createPaperTexture(1024, 1408, {
                bg: '#faf6f0',
                border: true, borderColor: '#c9a84c', borderWidth: 6, borderMargin: 40,
                ornament: true, ornamentY: 200, ornamentScale: 0.9,
                lines: [
                    { text: 'Together with their families', font: 'italic 32px "Cormorant Garamond"', color: '#6b5535', y: 340 },
                    { text: 'Sophia Elizabeth Hart', font: '72px "Great Vibes"', color: '#2c1810', y: 480 },
                    { text: '&', font: 'italic 42px "Cormorant Garamond"', color: '#c9a84c', y: 580 },
                    { text: 'James Alexander Cole', font: '72px "Great Vibes"', color: '#2c1810', y: 680 },
                    { text: 'request the honour of your presence', font: 'italic 30px "Cormorant Garamond"', color: '#6b5535', y: 800 },
                    { text: 'at the celebration of their marriage', font: 'italic 30px "Cormorant Garamond"', color: '#6b5535', y: 850 },
                    { text: 'Saturday, the Fourteenth of June', font: '400 34px "Cormorant Garamond"', color: '#3a2a1a', y: 980 },
                    { text: 'Two Thousand Twenty-Five', font: '400 34px "Cormorant Garamond"', color: '#3a2a1a', y: 1030 },
                    { text: 'at half past four in the afternoon', font: 'italic 28px "Cormorant Garamond"', color: '#6b5535', y: 1120 }
                ]
            });

            const insideRightTex = createPaperTexture(1024, 1408, {
                bg: '#faf6f0',
                border: true, borderColor: '#c9a84c', borderWidth: 6, borderMargin: 40,
                ornament: true, ornamentY: 200, ornamentScale: 0.9,
                flourish: true, flourishY: 720, flourishW: 200,
                lines: [
                    { text: 'Reception to follow', font: 'italic 36px "Cormorant Garamond"', color: '#6b5535', y: 340 },
                    { text: 'The Grand Rose Garden', font: '600 38px "Cormorant Garamond"', color: '#2c1810', y: 450 },
                    { text: 'Villa Belle Époque', font: '400 32px "Cormorant Garamond"', color: '#3a2a1a', y: 510 },
                    { text: '1247 Lavender Lane', font: '300 28px "Cormorant Garamond"', color: '#6b5535', y: 580 },
                    { text: 'Tuscany, Italy', font: '300 28px "Cormorant Garamond"', color: '#6b5535', y: 625 },
                    { text: 'Dinner · Dancing · Celebration', font: 'italic 30px "Cormorant Garamond"', color: '#c9a84c', y: 820 },
                    { text: 'RSVP by May 1st', font: '400 32px "Cormorant Garamond"', color: '#3a2a1a', y: 960 },
                    { text: 'sophiaandjames@eternal.love', font: '300 26px "Montserrat"', color: '#8b7355', y: 1030 },
                    { text: 'We cannot wait to celebrate with you', font: 'italic 28px "Cormorant Garamond"', color: '#6b5535', y: 1160 }
                ]
            });

            const backTex = createPaperTexture(1024, 1408, {
                bg: '#f0e8dc',
                border: true, borderColor: '#c9a84c', borderWidth: 8, borderMargin: 48,
                ornament: true, ornamentY: 500, ornamentScale: 2,
                lines: [
                    { text: 'S  ❤  J', font: '64px "Great Vibes"', color: '#c9a84c', y: 700 },
                    { text: 'Forever Begins', font: 'italic 36px "Cormorant Garamond"', color: '#8b7355', y: 820 }
                ]
            });

            /* ============================================================
               CARD GEOMETRY
               ------------------------------------------------------------
               Layout (local group space, spine at x=0):
                 • Right panel  (back cover of the book) at x = +CARD_W/2
                 • Cover pivot at x = 0
                 • Cover mesh inside pivot at x = +CARD_W/2
               When closed, cover sits directly on top of the right panel.
               Group offset -CARD_W/2 centres the closed cover on screen.
               When open, cover rotates ~180° and lands at x = -CARD_W/2,
               while the group animates to x = 0 so the spread is centred.
               ============================================================ */

            cardGroup.position.set(-CARD_W / 2, 0.3, 0);

            const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc8, roughness: 0.8 });

            /* --- Right panel (back cover of the book / inside-right page) --- */
            const panelGeo = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D * 0.7);
            const rightMats = [
                edgeMat, edgeMat, edgeMat, edgeMat,
                new THREE.MeshStandardMaterial({ map: insideRightTex, roughness: 0.75, metalness: 0.05 }),
                new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.75, metalness: 0.05 })
            ];
            const rightPanel = new THREE.Mesh(panelGeo, rightMats);
            rightPanel.castShadow = true;
            rightPanel.receiveShadow = true;
            rightPanel.position.set(CARD_W / 2, 0, 0);
            cardGroup.add(rightPanel);

            /* --- Front cover (rotates on a spine hinge) --- */
            const coverGeo = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D);
            const coverMats = [
                edgeMat, edgeMat, edgeMat, edgeMat,
                // +z face: outer front cover
                new THREE.MeshStandardMaterial({ map: coverTex, roughness: 0.75, metalness: 0.05 }),
                // -z face: inside-left page (revealed when open)
                new THREE.MeshStandardMaterial({ map: insideLeftTex, roughness: 0.75, metalness: 0.05 })
            ];
            const cover = new THREE.Mesh(coverGeo, coverMats);
            cover.castShadow = true;
            cover.receiveShadow = true;
            // Offset within the pivot so its left edge sits exactly on the spine
            cover.position.set(CARD_W / 2, 0, CARD_D / 2 + 0.001);

            const coverPivot = new THREE.Group();
            coverPivot.position.set(0, 0, 0); // spine
            coverPivot.add(cover);
            cardGroup.add(coverPivot);

            /* --- Ribbon & bow attached to the cover --- */
            function makeRibbon() {
                const g = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({ color: 0xb8952c, metalness: 0.6, roughness: 0.3, emissive: 0x3a2800, emissiveIntensity: 0.15 });
                const band = new THREE.Mesh(new THREE.BoxGeometry(0.22, CARD_H + 0.1, 0.04), mat);
                band.position.set(0.15, 0, CARD_D + 0.02);
                band.castShadow = true;
                g.add(band);
                const bow1 = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.07, 8, 16, Math.PI), mat);
                bow1.position.set(0.15, 0.9, CARD_D + 0.08);
                bow1.rotation.z = Math.PI * 0.15;
                bow1.rotation.y = 0.3;
                g.add(bow1);
                const bow2 = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.07, 8, 16, Math.PI), mat);
                bow2.position.set(0.15, 0.9, CARD_D + 0.08);
                bow2.rotation.z = -Math.PI * 0.15 - Math.PI;
                bow2.rotation.y = -0.3;
                g.add(bow2);
                const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), mat);
                knot.position.set(0.15, 0.9, CARD_D + 0.1);
                g.add(knot);
                const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.55, 0.03), mat);
                t1.position.set(0.05, 0.55, CARD_D + 0.06);
                t1.rotation.z = 0.2;
                g.add(t1);
                const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.03), mat);
                t2.position.set(0.25, 0.55, CARD_D + 0.06);
                t2.rotation.z = -0.25;
                g.add(t2);
                return g;
            }
            cover.add(makeRibbon());

            /* --- Interlocked wedding rings --- */
            function makeRing(r, tube, color) {
                const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.95, roughness: 0.12, emissive: color, emissiveIntensity: 0.08 });
                const ring = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 16, 48), mat);
                ring.castShadow = true;
                return ring;
            }
            const rings = new THREE.Group();
            const ring1 = makeRing(0.35, 0.045, 0xf5d78e);
            ring1.rotation.x = Math.PI / 2.2; ring1.rotation.z = 0.3; ring1.position.set(-0.2, 0, 0);
            rings.add(ring1);
            const ring2 = makeRing(0.35, 0.045, 0xe8c878);
            ring2.rotation.x = Math.PI / 2.2; ring2.rotation.z = -0.3; ring2.position.set(0.2, 0, 0);
            rings.add(ring2);
            rings.position.set(0, -CARD_H / 2 - 0.8, 0);
            rings.visible = false;
            cardGroup.add(rings);

            /* --- Roses --- */
            const petalGeo = new THREE.SphereGeometry(1, 8, 8);
            petalGeo.scale(0.5, 1, 0.15);
            function createRose(scale, color) {
                const g = new THREE.Group();
                const petalMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide, emissive: color, emissiveIntensity: 0.05 });
                for (let layer = 0; layer < 4; layer++) {
                    const count = 5 + layer * 2;
                    const rad = 0.08 + layer * 0.07;
                    for (let i = 0; i < count; i++) {
                        const p = new THREE.Mesh(petalGeo, petalMat);
                        const a = (i / count) * Math.PI * 2 + layer * 0.4;
                        p.position.set(Math.cos(a) * rad, layer * 0.04, Math.sin(a) * rad);
                        p.rotation.y = a;
                        p.rotation.x = -0.4 - layer * 0.15;
                        p.scale.setScalar(0.12 + layer * 0.04);
                        g.add(p);
                    }
                }
                const center = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffe8a0, roughness: 0.4, emissive: 0xffcc66, emissiveIntensity: 0.3 }));
                center.position.y = 0.12;
                g.add(center);
                const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 });
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.6, 6), stemMat);
                stem.position.y = -0.3;
                g.add(stem);
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a7a30, roughness: 0.7, side: THREE.DoubleSide });
                const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 6, 6), leafMat);
                leaf.scale.set(0.12, 0.06, 0.02);
                leaf.position.set(0.1, -0.2, 0);
                leaf.rotation.z = -0.5; leaf.rotation.y = 0.3;
                g.add(leaf);
                g.scale.setScalar(scale);
                return g;
            }
            const roses = new THREE.Group();
            const roseColors = [0xc45c6a, 0xd4707e, 0xb8405a, 0xe8909a, 0xa03050];
            const rosePositions = [
                [-2.8, -2.2, 1.2], [-2.3, -2.6, 0.5], [-3.1, -1.8, 0.3],
                [2.8, -2.3, 1.0], [2.4, -2.7, 0.4], [3.0, -1.9, 0.6],
                [-2.0, -2.8, -0.3], [2.1, -2.9, -0.2],
                [0, -3.0, 0.8], [-0.6, -2.85, 0.3], [0.7, -2.9, 0.2]
            ];
            rosePositions.forEach((pos, i) => {
                const rose = createRose(0.7 + Math.random() * 0.5, roseColors[i % roseColors.length]);
                rose.position.set(...pos);
                rose.rotation.y = Math.random() * Math.PI * 2;
                rose.rotation.z = (Math.random() - 0.5) * 0.4;
                rose.castShadow = true;
                roses.add(rose);
            });
            cardGroup.add(roses);

            /* --- Ground --- */
            const groundGeo = new THREE.CircleGeometry(8, 64);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x120a1a, roughness: 0.95, metalness: 0, transparent: true, opacity: 0.7 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -3.2;
            ground.receiveShadow = true;
            scene.add(ground);

            /* --- Particles --- */
            const particleCount = 400;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(particleCount * 3);
            const pVel = [];
            for (let i = 0; i < particleCount; i++) {
                pPos[i * 3] = (Math.random() - 0.5) * 16;
                pPos[i * 3 + 1] = Math.random() * 12 - 2;
                pPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
                pVel.push({
                    x: (Math.random() - 0.5) * 0.003,
                    y: 0.004 + Math.random() * 0.008,
                    z: (Math.random() - 0.5) * 0.003
                });
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
                color: 0xf5d78e, size: 0.06, transparent: true, opacity: 0.65,
                blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            }));
            scene.add(particles);

            /* --- Confetti --- */
            const confettiCount = 80;
            const confettiGroup = new THREE.Group();
            scene.add(confettiGroup);
            const confettiColors = [0xf5d78e, 0xc45c6a, 0xe8c0d0, 0xffffff, 0xc9a84c, 0xa0d0ff];
            const confettiData = [];
            for (let i = 0; i < confettiCount; i++) {
                const cg = new THREE.PlaneGeometry(0.08 + Math.random() * 0.06, 0.04 + Math.random() * 0.03);
                const cm = new THREE.MeshBasicMaterial({ color: confettiColors[i % confettiColors.length], side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
                const c = new THREE.Mesh(cg, cm);
                c.position.set((Math.random() - 0.5) * 10, Math.random() * 8 + 2, (Math.random() - 0.5) * 8);
                c.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                confettiGroup.add(c);
                confettiData.push({
                    vx: (Math.random() - 0.5) * 0.01,
                    vy: -(0.005 + Math.random() * 0.01),
                    vz: (Math.random() - 0.5) * 0.01,
                    rx: (Math.random() - 0.5) * 0.04,
                    ry: (Math.random() - 0.5) * 0.04,
                    rz: (Math.random() - 0.5) * 0.04
                });
            }

            /* --- Glowing gold rings on the ground --- */
            const goldRing = new THREE.Mesh(
                new THREE.TorusGeometry(5.5, 0.015, 8, 100),
                new THREE.MeshStandardMaterial({ color: 0xf5d78e, metalness: 0.9, roughness: 0.2, emissive: 0xf5d78e, emissiveIntensity: 0.25, transparent: true, opacity: 0.5 })
            );
            goldRing.rotation.x = Math.PI / 2;
            goldRing.position.y = -3.15;
            scene.add(goldRing);
            const goldRing2 = goldRing.clone();
            goldRing2.scale.setScalar(0.75);
            goldRing2.material = goldRing.material.clone();
            goldRing2.material.opacity = 0.3;
            scene.add(goldRing2);

            /* ============================================================
               UI / STATE
               ============================================================ */
            let isOpen = false;
            let openProgress = 0;
            let targetOpen = 0;
            let autoSpin = false;

            const btnOpen = document.getElementById('btn-open');
            const btnSpin = document.getElementById('btn-spin');
            const btnReset = document.getElementById('btn-reset');

            btnOpen.addEventListener('click', () => {
                targetOpen = targetOpen < 0.5 ? 1 : 0;
                isOpen = targetOpen > 0.5;
                btnOpen.textContent = isOpen ? 'Close Card' : 'Open Card';
                btnOpen.classList.toggle('active', isOpen);
            });

            btnSpin.addEventListener('click', () => {
                autoSpin = !autoSpin;
                controls.autoRotate = autoSpin;
                btnSpin.classList.toggle('active', autoSpin);
            });

            btnReset.addEventListener('click', () => {
                targetOpen = 0; isOpen = false;
                btnOpen.textContent = 'Open Card';
                btnOpen.classList.remove('active');
                autoSpin = false;
                controls.autoRotate = false;
                btnSpin.classList.remove('active');
                gsapCamera({ x: 0, y: 1.8, z: 9.5 }, 0.3);
            });

            function gsapCamera(pos, targetY) {
                const start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
                const startT = controls.target.y;
                const dur = 1200;
                const t0 = performance.now();
                (function anim() {
                    const t = Math.min((performance.now() - t0) / dur, 1);
                    const e = 1 - Math.pow(1 - t, 3);
                    camera.position.x = start.x + (pos.x - start.x) * e;
                    camera.position.y = start.y + (pos.y - start.y) * e;
                    camera.position.z = start.z + (pos.z - start.z) * e;
                    controls.target.y = startT + (targetY - startT) * e;
                    if (t < 1) requestAnimationFrame(anim);
                })();
            }

            cardGroup.rotation.y = -0.15;

            /* ============================================================
               ANIMATION
               ============================================================ */
            let time = 0;

            function animate() {
                requestAnimationFrame(animate);
                time += 0.016;

                /* Card open / close animation */
                openProgress += (targetOpen - openProgress) * 0.05;
                // Swing the cover around the spine
                coverPivot.rotation.y = -openProgress * Math.PI * 0.96;
                // Slide the whole group so the closed cover (or open spread) stays centred
                cardGroup.position.x = -CARD_W / 2 * (1 - openProgress);

                /* Rings rise when card opens */
                if (openProgress > 0.3) {
                    const s = Math.min((openProgress - 0.3) / 0.5, 1);
                    rings.scale.setScalar(s);
                    rings.rotation.y = time * 0.5;
                    rings.visible = true;
                } else {
                    rings.visible = false;
                }

                /* Gentle idle motion */
                cardGroup.position.y = 0.3 + Math.sin(time * 0.7) * 0.08;
                cardGroup.rotation.z = Math.sin(time * 0.4) * 0.015;

                /* Roses drift */
                roses.children.forEach((r, i) => {
                    r.rotation.y += 0.002 * (i % 2 === 0 ? 1 : -1);
                    r.position.y += Math.sin(time * 0.8 + i) * 0.0003;
                });

                /* Rising gold particles */
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] += pVel[i].x;
                    positions[i * 3 + 1] += pVel[i].y;
                    positions[i * 3 + 2] += pVel[i].z;
                    if (positions[i * 3 + 1] > 10) {
                        positions[i * 3 + 1] = -2;
                        positions[i * 3] = (Math.random() - 0.5) * 16;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 16;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
                particles.rotation.y = time * 0.02;

                /* Falling confetti */
                confettiGroup.children.forEach((c, i) => {
                    const d = confettiData[i];
                    c.position.x += d.vx;
                    c.position.y += d.vy;
                    c.position.z += d.vz;
                    c.rotation.x += d.rx;
                    c.rotation.y += d.ry;
                    c.rotation.z += d.rz;
                    if (c.position.y < -3.5) {
                        c.position.y = 8 + Math.random() * 2;
                        c.position.x = (Math.random() - 0.5) * 10;
                        c.position.z = (Math.random() - 0.5) * 8;
                    }
                });

                /* Light breathing */
                rimLight.intensity = 1.5 + Math.sin(time * 1.5) * 0.3;
                softGlow.intensity = 0.5 + Math.sin(time * 1.2) * 0.2;
                goldRing.rotation.z = time * 0.1;
                goldRing2.rotation.z = -time * 0.07;

                controls.update();
                renderer.render(scene, camera);
            }

            /* Resize */
            window.addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            });

            /* Double-click toggles the card */
            renderer.domElement.addEventListener('dblclick', () => {
                targetOpen = targetOpen < 0.5 ? 1 : 0;
                isOpen = targetOpen > 0.5;
                btnOpen.textContent = isOpen ? 'Close Card' : 'Open Card';
                btnOpen.classList.toggle('active', isOpen);
            });

            /* Boot */
            setTimeout(() => {
                document.getElementById('loader').classList.add('hide');
                animate();
            }, 600);
        })();
    </script>
</body>

</html>
