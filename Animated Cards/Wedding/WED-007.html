<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Maison Lumière — Premium 3D Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --gold: #c9a14a;
            --gold-hi: #f3dd9b;
            --glass: rgba(14, 14, 20, .38);
            --line: rgba(255, 255, 255, .12);
            --text: #f5efe3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070d;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased
        }

        #scene {
            position: fixed;
            inset: 0;
            display: block;
            outline: none;
            touch-action: none
        }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: radial-gradient(circle at 50% 45%, #1a1f33, #05070d 70%);
            transition: opacity 1.2s ease, visibility 1.2s
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden
        }

        .ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 1px solid rgba(201, 161, 74, .2);
            border-top-color: var(--gold);
            animation: spin 1.4s linear infinite;
            position: relative
        }

        .ring::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px solid rgba(201, 161, 74, .15);
            border-bottom-color: var(--gold-hi);
            animation: spin 2s linear infinite reverse
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #loader p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 20px;
            letter-spacing: .06em;
            color: #e8dcc4
        }

        #loader small {
            font-family: 'Cinzel', serif;
            letter-spacing: .4em;
            font-size: 11px;
            color: var(--gold)
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35)
        }

        /* Header */
        #brand {
            position: fixed;
            top: 22px;
            left: 26px;
            z-index: 10;
            pointer-events: none
        }

        #brand h1 {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 18px;
            letter-spacing: .32em;
            color: var(--gold-hi)
        }

        #brand span {
            display: block;
            margin-top: 6px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 15px;
            color: rgba(245, 239, 227, .7);
            letter-spacing: .05em
        }

        /* Countdown */
        #countdown {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 10px 16px
        }

        #countdown .u {
            text-align: center;
            min-width: 54px
        }

        #countdown b {
            display: block;
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 20px;
            color: var(--gold-hi)
        }

        #countdown i {
            font-style: normal;
            font-size: 9px;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: rgba(245, 239, 227, .6)
        }

        #countdown .sep {
            width: 1px;
            background: var(--line);
            margin: 4px 2px
        }

        /* Themes */
        #themes {
            position: fixed;
            top: 22px;
            right: 24px;
            z-index: 10;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end
        }

        #themes label {
            font-size: 9px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(245, 239, 227, .6)
        }

        .sw {
            display: flex;
            gap: 10px
        }

        .sw button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .25);
            cursor: pointer;
            transition: transform .3s, border-color .3s, box-shadow .3s;
            position: relative
        }

        .sw button:hover {
            transform: scale(1.12)
        }

        .sw button.active {
            border-color: var(--gold-hi);
            box-shadow: 0 0 0 3px rgba(243, 221, 155, .18), 0 0 16px rgba(243, 221, 155, .35)
        }

        .sw button[data-t=royal] {
            background: linear-gradient(135deg, #1b2440 50%, #c9a14a 50%)
        }

        .sw button[data-t=rose] {
            background: linear-gradient(135deg, #d19a98 50%, #e7b9a0 50%)
        }

        .sw button[data-t=emerald] {
            background: linear-gradient(135deg, #0f3d31 50%, #d4af37 50%)
        }

        .sw button[data-t=noir] {
            background: linear-gradient(135deg, #141414 50%, #e8e2d4 50%)
        }

        /* Personalize */
        #personal {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 10;
            padding: 14px 16px;
            width: 250px
        }

        #personal label {
            display: block;
            font-size: 9px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(245, 239, 227, .6);
            margin-bottom: 8px
        }

        #personal input {
            width: 100%;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            outline: none;
            transition: border-color .3s
        }

        #personal input:focus {
            border-color: var(--gold)
        }

        #personal .row {
            display: flex;
            gap: 8px;
            margin-top: 10px
        }

        #personal .row button {
            flex: 1
        }

        /* Controls */
        #controls {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            padding: 8px
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--text);
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all .35s ease;
            white-space: nowrap
        }

        .btn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold-hi);
            background: rgba(201, 161, 74, .1)
        }

        .btn:disabled {
            opacity: .35;
            cursor: default
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-hi) 55%, var(--gold));
            color: #1a1408;
            border-color: transparent;
            box-shadow: 0 6px 24px rgba(201, 161, 74, .3)
        }

        .btn.primary:hover:not(:disabled) {
            color: #1a1408;
            filter: brightness(1.08);
            box-shadow: 0 8px 30px rgba(201, 161, 74, .5)
        }

        .btn.small {
            padding: 9px 10px;
            font-size: 9.5px;
            letter-spacing: .14em
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 96px;
            transform: translateX(-50%);
            z-index: 10;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 18px;
            color: rgba(245, 239, 227, .85);
            letter-spacing: .04em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .6);
            transition: opacity .8s;
            pointer-events: none;
            white-space: nowrap;
            animation: breathe 3s ease-in-out infinite
        }

        #hint.hide {
            opacity: 0
        }

        @keyframes breathe {
            50% {
                opacity: .55
            }
        }

        /* Modal */
        #modal {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(3, 4, 8, .55);
            opacity: 0;
            visibility: hidden;
            transition: opacity .5s, visibility .5s;
            padding: 20px
        }

        #modal.show {
            opacity: 1;
            visibility: visible
        }

        .card {
            width: min(460px, 100%);
            padding: 34px 32px 28px;
            transform: translateY(20px) scale(.97);
            transition: transform .6s cubic-bezier(.2, .9, .3, 1.2);
            position: relative;
            max-height: 92vh;
            overflow: auto
        }

        #modal.show .card {
            transform: none
        }

        .card h2 {
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            font-size: 46px;
            color: var(--gold-hi);
            text-align: center;
            line-height: 1
        }

        .card .sub {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 10px;
            letter-spacing: .35em;
            color: rgba(245, 239, 227, .65);
            margin: 10px 0 22px
        }

        .card .f {
            margin-bottom: 14px
        }

        .card .f>label {
            display: block;
            font-size: 9px;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: rgba(245, 239, 227, .6);
            margin-bottom: 7px
        }

        .card input[type=text],
        .card select,
        .card textarea {
            width: 100%;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            outline: none
        }

        .card select option {
            background: #1a1d29
        }

        .card textarea {
            resize: none;
            height: 70px
        }

        .card input:focus,
        .card select:focus,
        .card textarea:focus {
            border-color: var(--gold)
        }

        .choice {
            display: flex;
            gap: 8px
        }

        .choice label {
            flex: 1;
            cursor: pointer
        }

        .choice input {
            display: none
        }

        .choice span {
            display: block;
            text-align: center;
            padding: 10px 6px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            transition: all .3s
        }

        .choice input:checked+span {
            border-color: var(--gold);
            background: rgba(201, 161, 74, .14);
            color: var(--gold-hi)
        }

        .card .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px
        }

        .card .actions .btn {
            flex: 1
        }

        .close {
            position: absolute;
            top: 12px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(245, 239, 227, .6);
            font-size: 22px;
            cursor: pointer
        }

        .thanks {
            text-align: center;
            padding: 10px 0
        }

        .thanks p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            line-height: 1.6;
            color: rgba(245, 239, 227, .85);
            margin-top: 14px
        }

        #toast {
            position: fixed;
            left: 50%;
            top: 90px;
            transform: translate(-50%, -10px);
            z-index: 60;
            padding: 10px 18px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            opacity: 0;
            transition: all .5s;
            pointer-events: none
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        @media (max-width:860px) {
            #countdown {
                top: auto;
                bottom: 150px;
                padding: 8px 10px
            }

            #countdown .u {
                min-width: 44px
            }

            #countdown b {
                font-size: 16px
            }

            #personal {
                display: none
            }

            #controls {
                bottom: 14px;
                flex-wrap: wrap;
                justify-content: center;
                width: calc(100% - 24px)
            }

            .btn {
                padding: 10px 11px;
                font-size: 9.5px;
                letter-spacing: .12em
            }

            #hint {
                bottom: 210px;
                font-size: 16px
            }

            #brand h1 {
                font-size: 13px
            }

            #brand span {
                font-size: 12px
            }

            #themes {
                padding: 9px 10px
            }

            .sw button {
                width: 24px;
                height: 24px
            }
        }
    </style>
    <script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>

<body>
    <canvas id="scene"></canvas>

    <div id="loader">
        <div class="ring"></div><small>MAISON LUMIÈRE</small>
        <p>Preparing your invitation…</p>
    </div>

    <div id="brand">
        <h1>MAISON LUMIÈRE</h1><span>Bespoke three-dimensional invitations</span>
    </div>

    <div id="countdown" class="glass">
        <div class="u"><b id="cd-d">000</b><i>Days</i></div>
        <div class="sep"></div>
        <div class="u"><b id="cd-h">00</b><i>Hours</i></div>
        <div class="sep"></div>
        <div class="u"><b id="cd-m">00</b><i>Min</i></div>
        <div class="sep"></div>
        <div class="u"><b id="cd-s">00</b><i>Sec</i></div>
    </div>

    <div id="themes" class="glass">
        <label>Collection</label>
        <div class="sw">
            <button data-t="royal" class="active" title="Royal Navy"></button>
            <button data-t="rose" title="Rose Blush"></button>
            <button data-t="emerald" title="Emerald Estate"></button>
            <button data-t="noir" title="Noir Ivory"></button>
        </div>
    </div>

    <div id="personal" class="glass">
        <label>Personalize for guest</label>
        <input id="guestInput" type="text" maxlength="32" placeholder="Guest name">
        <div class="row">
            <button class="btn small" id="applyGuest">Engrave</button>
            <button class="btn small" id="copyLink">Copy Link</button>
        </div>
    </div>

    <div id="hint">Tap the wax seal to open · Drag to explore</div>

    <div id="controls" class="glass">
        <button class="btn primary" id="btnOpen">Open Invitation</button>
        <button class="btn" id="btnFlip" disabled>Flip Card</button>
        <button class="btn" id="btnRsvp">RSVP</button>
        <button class="btn" id="btnCal">Save the Date</button>
        <button class="btn" id="btnReset" disabled>Reseal</button>
    </div>

    <div id="modal">
        <div class="card glass">
            <button class="close" id="closeModal">×</button>
            <div id="rsvpForm">
                <h2>Kindly Reply</h2>
                <div class="sub">BY THE FIRST OF AUGUST</div>
                <div class="f"><label>Full Name</label><input type="text" id="rName"></div>
                <div class="f"><label>Attendance</label>
                    <div class="choice">
                        <label><input type="radio" name="att" value="yes" checked><span>Joyfully accepts</span></label>
                        <label><input type="radio" name="att" value="no"><span>Regretfully declines</span></label>
                    </div>
                </div>
                <div class="f"><label>Number of Guests</label>
                    <select id="rCount">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                    </select>
                </div>
                <div class="f"><label>Dietary Notes</label><input type="text" id="rDiet" placeholder="Optional"></div>
                <div class="f"><label>A Note for the Couple</label><textarea id="rMsg"
                        placeholder="Optional"></textarea></div>
                <div class="actions"><button class="btn" id="cancelRsvp">Later</button><button class="btn primary"
                        id="sendRsvp">Send Reply</button></div>
            </div>
            <div id="rsvpThanks" class="thanks" style="display:none">
                <h2>Thank You</h2>
                <p id="thanksText"></p>
                <div class="actions"><button class="btn primary" id="doneRsvp">Close</button></div>
            </div>
        </div>
    </div>

    <div id="toast" class="glass"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        /* ---------------- Data ---------------- */
        const INV = {
            bride: 'Amelia', groom: 'James', mono: 'AJ',
            date: new Date('2026-09-19T16:30:00'),
        };
        const THEMES = {
            royal: { paper: '#f8f2e4', gold: '#c9a14a', goldHi: '#f5e0a0', ink: '#2c2833', env: '#1b2440', envDark: '#121a31', seal: '#7d1426', sealMetal: false, bg1: '#1d2640', bg2: '#04060c', petal: '#f4e9d6', accent: '#f0cf7e' },
            rose: { paper: '#fdf3ef', gold: '#c48b72', goldHi: '#f3cdb8', ink: '#4a3434', env: '#d19a98', envDark: '#b67d7c', seal: '#caa061', sealMetal: true, bg1: '#3a2427', bg2: '#0d0708', petal: '#f7c6c7', accent: '#ffd1c1' },
            emerald: { paper: '#f6f2e8', gold: '#d4af37', goldHi: '#f7e39a', ink: '#1f2a25', env: '#0f3d31', envDark: '#082a21', seal: '#c9a14a', sealMetal: true, bg1: '#0f2a23', bg2: '#030907', petal: '#fff6e0', accent: '#f2d57a' },
            noir: { paper: '#f3efe6', gold: '#b9b2a2', goldHi: '#f4f0e6', ink: '#141414', env: '#161616', envDark: '#0b0b0b', seal: '#1f1f1f', sealMetal: false, bg1: '#262626', bg2: '#040404', petal: '#ffffff', accent: '#ece6d6' },
        };
        let themeName = 'royal', theme = THEMES[themeName];
        const params = new URLSearchParams(location.search);
        let guestName = (params.get('guest') || 'Our Dear Guest').slice(0, 32);
        if (params.get('theme') && THEMES[params.get('theme')]) { themeName = params.get('theme'); theme = THEMES[themeName]; }

        /* ---------------- Renderer / Scene ---------------- */
        const canvas = document.getElementById('scene');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const maxAniso = renderer.capabilities.getMaxAnisotropy();

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
        scene.fog = new THREE.Fog(theme.bg2, 16, 34);

        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 0.5, 8.5);
        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true; controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.minPolarAngle = Math.PI * 0.22; controls.maxPolarAngle = Math.PI * 0.72;
        controls.minAzimuthAngle = -Math.PI * 0.45; controls.maxAzimuthAngle = Math.PI * 0.45;
        controls.rotateSpeed = 0.6;
        controls.target.set(0, 0, 0);

        /* Lights */
        scene.add(new THREE.HemisphereLight(0xfff4e0, 0x1a1a2a, 0.55));
        const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
        key.position.set(3.5, 6, 7); key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
        key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
        scene.add(key);
        const rim = new THREE.SpotLight(0x9fb4ff, 40, 30, 0.5, 0.6);
        rim.position.set(-6, 4, -6); scene.add(rim);
        const shimmer = new THREE.PointLight(0xffd79a, 18, 14, 2);
        scene.add(shimmer);
        const fill = new THREE.PointLight(0xffe6c4, 8, 18, 2);
        fill.position.set(-4, -1, 5); scene.add(fill);

        /* Ground shadow catcher */
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.35 }));
        ground.rotation.x = -Math.PI / 2; ground.position.y = -2.9; ground.receiveShadow = true;
        scene.add(ground);

        /* ---------------- Canvas helpers ---------------- */
        const cEl = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
        function mkTex(c, color = true) { const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t; }
        function shade(hex, amt) {
            const c = new THREE.Color(hex); const hsl = {}; c.getHSL(hsl);
            c.setHSL(hsl.h, hsl.s, THREE.MathUtils.clamp(hsl.l + amt, 0, 1)); return '#' + c.getHexString();
        }
        function grain(x, W, H, n, a = 0.035) {
            for (let i = 0; i < n; i++) {
                x.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a * 1.4})`;
                x.fillRect(Math.random() * W, Math.random() * H, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }
        }
        function pal(mode, x, W, H, base, ink) {
            if (mode === 'color') {
                const g = x.createLinearGradient(0, 0, W, H * 0.6);
                g.addColorStop(0, theme.gold); g.addColorStop(.3, theme.goldHi); g.addColorStop(.55, theme.gold);
                g.addColorStop(.8, theme.goldHi); g.addColorStop(1, shade(theme.gold, -0.15));

            x.bezierCurveTo(2, 44, 6, 8, 24, 4); x.quadraticCurveTo(32, 12, 40, 4); x.bezierCurveTo(58, 8, 62, 44, 32, 62); x.fill(); return mkTex(c, false);
        })();
        const pg = new THREE.PlaneGeometry(0.17, 0.22, 5, 5); { const p = pg.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, x * x * 5 - y * y * 1.2); } pg.computeVertexNormals(); }
        const petalMat = new THREE.MeshStandardMaterial({ color: theme.petal, alphaMap: petalTex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.55, emissive: new THREE.Color(theme.petal), emissiveIntensity: 0.08 });
        const PETALS = 70; const petals = new THREE.InstancedMesh(pg, petalMat, PETALS); scene.add(petals);
        const pData = []; const dummy = new THREE.Object3D();
        function resetPetal(d, top) {
            d.p = new THREE.Vector3((Math.random() - .5) * 16, top ? 6 + Math.random() * 3 : (Math.random() - .5) * 12, (Math.random() - .5) * 8 - 1);
            d.v = 0.25 + Math.random() * 0.35; d.r = new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6); d.s = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(2); d.ph = Math.random() * 10;
        }
        for (let i = 0; i < PETALS; i++) { const d = {}; resetPetal(d, false); pData.push(d); }

        /* Bursts */
        const bursts = [];
        function burst(pos, n, cols, spd, size = 0.07) {
            const g = new THREE.BufferGeometry(), P = new Float32Array(n * 3), C = new Float32Array(n * 3), V = []; const col = new THREE.Color();
            for (let i = 0; i < n; i++) {
                P[i * 3] = pos.x; P[i * 3 + 1] = pos.y; P[i * 3 + 2] = pos.z;
                const d = new THREE.Vector3(Math.random() - .5, Math.random() - .3, Math.random() - .5).normalize().multiplyScalar(spd * (0.3 + Math.random()));
                V.push(d); col.set(cols[i % cols.length]); C[i * 3] = col.r; C[i * 3 + 1] = col.g; C[i * 3 + 2] = col.b;
            }
            g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('color', new THREE.BufferAttribute(C, 3));
            const m = new THREE.PointsMaterial({ size, map: sprite, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
            const pts = new THREE.Points(g, m); scene.add(pts); bursts.push({ pts, V, age: 0, life: 2.4 });
        }

        /* ---------------- Background ---------------- */
        function paintBG() {
            const c = cEl(1024, 1024), x = c.getContext('2d'); const g = x.createRadialGradient(512, 430, 40, 512, 512, 720);
            g.addColorStop(0, theme.bg1); g.addColorStop(1, theme.bg2); x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
            grain(x, 1024, 1024, 6000, 0.02); return mkTex(c);
        }

        /* ---------------- Theme application ---------------- */
        function rebuildCardTextures() {
            setMaps(cardFrontMat, m => paintCard('front', m));
            setMaps(cardBackMat, m => paintCard('back', m));
        }
        function rebuildGuestTextures() { setMaps(cardBackMat, m => paintCard('back', m)); setMaps(pocketMat, paintPocket); }
        function applyTheme(name) {
            themeName = name; theme = THEMES[name];
            rebuildCardTextures();
            setMaps(pocketMat, paintPocket);
            setMaps(flapMat, paintFlap);
            setMaps(flapLinerMat, m => paintLiner(m, 1024, 427));
            setMaps(backLinerMat, m => paintLiner(m, 1024, 707));
            setMaps(backOuterMat, paintBackOuter, true);
            cardEdgeMat.color.set(theme.gold);
            sealBodyMat.color.set(theme.seal); sealBodyMat.metalness = theme.sealMetal ? 0.85 : 0; sealBodyMat.roughness = theme.sealMetal ? 0.3 : 0.4;
            if (sealFaceMat.map) sealFaceMat.map.dispose(); if (sealFaceMat.bumpMap) sealFaceMat.bumpMap.dispose();
            sealFaceMat.map = mkTex(paintSeal(false)); sealFaceMat.bumpMap = mkTex(paintSeal(true), false);
            sealFaceMat.metalness = sealBodyMat.metalness; sealFaceMat.roughness = sealBodyMat.roughness; sealFaceMat.needsUpdate = true;
            if (scene.background) scene.background.dispose(); scene.background = paintBG(); scene.fog.color.set(theme.bg2);
            dustMat.color.set(theme.accent); bokeh.forEach(b => b.material.color.set(theme.accent));
            petalMat.color.set(theme.petal); petalMat.emissive.set(theme.petal); pulse.material.color.set(theme.accent);
            document.documentElement.style.setProperty('--gold', theme.gold);
            document.documentElement.style.setProperty('--gold-hi', theme.goldHi);
            document.querySelectorAll('.sw button').forEach(b => b.classList.toggle('active', b.dataset.t === name));
        }

        /* ---------------- Tweens ---------------- */
        const tweens = [];
        const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
        const easeInCubic = t => t * t * t;
        const easeOutBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
        function tween(dur, fn, ease = easeInOutCubic) { return new Promise(res => tweens.push({ t0: performance.now(), dur, fn, ease, res })); }
        const lerp = THREE.MathUtils.lerp;

        /* ---------------- States ---------------- */
        let state = 'intro', flipped = false;
        const $ = s => document.querySelector(s);
        function updateUI() {
            $('#btnOpen').disabled = state !== 'closed';
            $('#btnFlip').disabled = state !== 'open';
            $('#btnReset').disabled = state !== 'open';
            $('#btnFlip').textContent = flipped ? 'View Front' : 'Flip Card';
            $('#hint').classList.toggle('hide', state !== 'closed');
        }

        async function openInvite() {
            if (state !== 'closed') return; state = 'busy'; updateUI();
            const wp = new THREE.Vector3(); seal.getWorldPosition(wp);
            burst(wp, 180, [theme.gold, theme.goldHi, theme.accent], 2.4);
            sealMats.forEach(m => { m.transparent = true; }); pulse.visible = false;
            await tween(650, k => { seal.position.set(SEAL_POS.x, SEAL_POS.y + k * 0.4, SEAL_POS.z + k * 0.9); seal.rotation.set(k * 1.3, 0, k * 2.6); seal.scale.setScalar(1 - k * 0.6); sealMats.forEach(m => m.opacity = 1 - k); }, easeInCubic);
            seal.visible = false;
            await tween(1300, k => flapPivot.rotation.x = -Math.PI * k, easeInOutCubic);
            const ey = envelope.position.y;
            await tween(1200, k => { cardHolder.position.y = 2.8 * k; cardHolder.position.z = 0.06 * k; envelope.position.y = ey - 1.0 * k; }, easeInOutCubic);
            root.attach(cardHolder);
            const e0 = envelope.position.clone(), c0 = cardHolder.position.clone();
            await Promise.all([
                tween(1500, k => { envelope.position.set(0, lerp(e0.y, -2.05, k), lerp(e0.z, -1.4, k)); envelope.rotation.x = -0.5 * k; envelope.scale.setScalar(1 - 0.12 * k); }),
                tween(1500, k => { cardHolder.position.set(0, lerp(c0.y, 0.35, k), lerp(c0.z, 1.3, k)); cardHolder.rotation.x = Math.sin(k * Math.PI) * -0.22; cardHolder.scale.setScalar(1 + 0.06 * k); })
            ]);
            const cp = new THREE.Vector3(); card.getWorldPosition(cp);
            burst(cp, 260, [theme.gold, theme.goldHi, theme.accent, '#ffffff'], 3.2, 0.06);
            state = 'open'; updateUI();
        }
        async function flipCard() {
            if (state !== 'open') return; state = 'busy'; updateUI();
            const r0 = card.rotation.y, target = flipped ? 0 : Math.PI, z0 = cardHolder.position.z;
            await tween(1150, k => { card.rotation.y = lerp(r0, target, k); cardHolder.position.z = z0 + Math.sin(k * Math.PI) * 0.6; });
            flipped = !flipped; state = 'open'; updateUI();
        }
        async function resealInvite() {
            if (state !== 'open') return; state = 'busy'; updateUI();
            if (flipped) { const r0 = card.rotation.y; await tween(800, k => card.rotation.y = lerp(r0, 0, k)); flipped = false; }
            const e0 = envelope.position.clone(), er = envelope.rotation.x, es = envelope.scale.x, c0 = cardHolder.position.clone(), cs = cardHolder.scale.x;
            await Promise.all([
                tween(1300, k => { envelope.position.set(0, lerp(e0.y, -1, k), lerp(e0.z, 0, k)); envelope.rotation.x = lerp(er, 0, k); envelope.scale.setScalar(lerp(es, 1, k)); }),
                tween(1300, k => { cardHolder.position.set(0, lerp(c0.y, 1.8, k), lerp(c0.z, 0.06, k)); cardHolder.scale.setScalar(lerp(cs, 1, k)); cardHolder.rotation.x = 0; })
            ]);
            envelope.attach(cardHolder);
            const cy = cardHolder.position.y;
            await tween(1100, k => { cardHolder.position.y = lerp(cy, 0, k); cardHolder.position.z = 0.06 * (1 - k); envelope.position.y = -1 + k; });
            await tween(1100, k => flapPivot.rotation.x = -Math.PI * (1 - k));
            seal.visible = true; seal.rotation.set(0, 0, 0); seal.position.copy(SEAL_POS).add(new THREE.Vector3(0, 0, 0.5));
            await tween(700, k => { seal.position.z = SEAL_POS.z + 0.5 * (1 - k); seal.scale.setScalar(lerp(1.4, 1, k)); sealMats.forEach(m => m.opacity = k); }, easeOutBack);
            sealMats.forEach(m => { m.transparent = false; m.opacity = 1; }); pulse.visible = true;
            state = 'closed'; updateUI();
        }

        /* ---------------- Interaction ---------------- */
        const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); const pointer = { x: 0, y: 0 }; let downPos = null, dragging = false;
        const closedTargets = [sealBody, sealFace, flapOuter, pocket, backFront];
        function pick(e) {
            ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
            const list = state === 'closed' ? closedTargets : state === 'open' ? [card] : []; return list.length ? ray.intersectObjects(list, false)[0] : null;
        }
        canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
        canvas.addEventListener('pointerup', e => {
            if (!downPos) return; const d = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y); downPos = null;
            if (d < 6) { const h = pick(e); if (h) { if (state === 'closed') openInvite(); else if (state === 'open') flipCard(); } }
        });
        addEventListener('pointermove', e => {
            pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1;
            if (e.target === canvas) canvas.style.cursor = pick(e) ? 'pointer' : (dragging ? 'grabbing' : 'grab');
        });
        controls.addEventListener('start', () => dragging = true); controls.addEventListener('end', () => dragging = false);

        $('#btnOpen').onclick = openInvite; $('#btnFlip').onclick = flipCard; $('#btnReset').onclick = resealInvite;
        document.querySelectorAll('.sw button').forEach(b => b.onclick = () => applyTheme(b.dataset.t));

        function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
        $('#guestInput').value = guestName === 'Our Dear Guest' ? '' : guestName;
        function engrave() {
            const v = $('#guestInput').value.trim(); guestName = v || 'Our Dear Guest'; rebuildGuestTextures(); toast(`Engraved for ${guestName}`);
            const wp = new THREE.Vector3(); (state === 'open' ? card : pocket).getWorldPosition(wp); burst(wp, 120, [theme.gold, theme.goldHi], 1.8, 0.05);
        }
        $('#applyGuest').onclick = engrave; $('#guestInput').addEventListener('keydown', e => { if (e.key === 'Enter') engrave(); });
        $('#copyLink').onclick = async () => {
            const u = new URL(location.href); u.searchParams.set('guest', $('#guestInput').value.trim() || guestName); u.searchParams.set('theme', themeName);
            try { await navigator.clipboard.writeText(u.toString()); toast('Personal invitation link copied'); } catch { toast(u.toString()); }
        };

        $('#btnCal').onclick = () => {
            const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Maison Lumiere//Invitation//EN', 'BEGIN:VEVENT',
                'UID:amelia-james-' + Date.now() + '@maisonlumiere', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
                'DTSTART:20260919T163000', 'DTEND:20260920T010000', 'SUMMARY:Wedding of Amelia & James',
                'LOCATION:The Grand Orangery\\, Villa Medici Gardens\\, Florence\\, Italy',
                'DESCRIPTION:Ceremony 4:30 PM · Reception 6:30 PM · Dancing 9:00 PM. Black Tie.', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'Amelia-and-James-Wedding.ics'; a.click();
            toast('Save the date — calendar file downloaded');
        };

        const modal = $('#modal');
        function openModal() { $('#rName').value = guestName === 'Our Dear Guest' ? '' : guestName; $('#rsvpForm').style.display = ''; $('#rsvpThanks').style.display = 'none'; modal.classList.add('show'); }
        function closeModal() { modal.classList.remove('show'); }
        $('#btnRsvp').onclick = openModal; $('#closeModal').onclick = closeModal; $('#cancelRsvp').onclick = closeModal; $('#doneRsvp').onclick = closeModal;
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        $('#sendRsvp').onclick = () => {
            const name = $('#rName').value.trim() || guestName; const yes = document.querySelector('input[name=att]:checked').value === 'yes';
            const data = { name, attending: yes, guests: $('#rCount').value, diet: $('#rDiet').value, msg: $('#rMsg').value, at: new Date().toISOString() };
            try { localStorage.setItem('rsvp-amelia-james', JSON.stringify(data)); } catch { }
            $('#thanksText').innerHTML = yes ? `Dearest ${name},<br>your presence will make our day complete.<br>We cannot wait to celebrate with you in Florence.` : `Dearest ${name},<br>you will be dearly missed.<br>Thank you for your kind reply.`;
            $('#rsvpForm').style.display = 'none'; $('#rsvpThanks').style.display = '';
            for (let i = 0; i < 3; i++) setTimeout(() => burst(new THREE.Vector3((Math.random() - .5) * 4, 0.5 + Math.random(), 1.5), 220, [theme.gold, theme.goldHi, theme.accent, theme.petal], 3.5, 0.07), i * 260);
        };

        /* Countdown */
        function tick() {
            let d = INV.date - new Date(); if (d < 0) d = 0;
            const D = Math.floor(d / 864e5), H = Math.floor(d / 36e5) % 24, M = Math.floor(d / 6e4) % 60, S = Math.floor(d / 1e3) % 60;
            $('#cd-d').textContent = String(D).padStart(3, '0'); $('#cd-h').textContent = String(H).padStart(2, '0');
            $('#cd-m').textContent = String(M).padStart(2, '0'); $('#cd-s').textContent = String(S).padStart(2, '0');
        }
        setInterval(tick, 1000); tick();

        /* Resize / fit */
        function fit() {
            camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
            const need = 5.4, d = Math.max(8.2, need / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
            controls.maxDistance = d * 1.5; controls.minDistance = Math.min(4.2, d * 0.55);
            camera.position.sub(controls.target).setLength(d).add(controls.target);
        }
        addEventListener('resize', fit);

        /* ---------------- Loop ---------------- */
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
            for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; const p = Math.min(1, (now - tw.t0) / tw.dur); tw.fn(tw.ease(p)); if (p >= 1) { tweens.splice(i, 1); tw.res(); } }

            root.position.y = Math.sin(t * 0.8) * 0.06;
            const tx = dragging ? 0 : pointer.x * 0.14, ty = dragging ? 0 : pointer.y * 0.08;
            root.rotation.y += (tx - root.rotation.y) * 0.04; root.rotation.x += (ty - root.rotation.x) * 0.04;

            if (state === 'open') { card.position.y = Math.sin(t * 1.2) * 0.045; card.rotation.x = Math.sin(t * 0.9) * 0.035; card.rotation.z = Math.sin(t * 0.7) * 0.015; }
            else { card.position.y *= 0.9; card.rotation.x *= 0.9; card.rotation.z *= 0.9; }

            if (pulse.visible) { const k = (t * 0.8) % 1; pulse.scale.setScalar(1 + k * 0.6); pulse.material.opacity = 0.55 * (1 - k); }

            shimmer.position.set(Math.cos(t * 0.5) * 4.5, 1.5 + Math.sin(t * 0.7) * 1.5, 3.5 + Math.sin(t * 0.5) * 1.2);

            for (let i = 0; i < DUST; i++) {
                let y = dustPos[i * 3 + 1] + dt * (0.08 + (dustSeed[i] % 1) * 0.12); if (y > 5) y = -5; dustPos[i * 3 + 1] = y;
                dustPos[i * 3] += Math.sin(t * 0.5 + dustSeed[i]) * 0.0015;
            }
            dustGeo.attributes.position.needsUpdate = true;
            dustMat.opacity = 0.6 + Math.sin(t * 2) * 0.2;

            bokeh.forEach(b => { b.position.x += Math.sin(t * 0.1 + b.userData.seed) * 0.003; b.position.y += Math.cos(t * 0.13 + b.userData.seed) * 0.002; });

            for (let i = 0; i < PETALS; i++) {
                const d = pData[i];
                d.p.y -= d.v * dt; d.p.x += Math.sin(t * 0.8 + d.ph) * 0.006; d.p.z += Math.cos(t * 0.6 + d.ph) * 0.003;
                d.r.x += d.s.x * dt; d.r.y += d.s.y * dt; d.r.z += d.s.z * dt; if (d.p.y < -4.5) resetPetal(d, true);
                dummy.position.copy(d.p); dummy.rotation.copy(d.r); dummy.updateMatrix(); petals.setMatrixAt(i, dummy.matrix);
            }
            petals.instanceMatrix.needsUpdate = true;

            for (let i = bursts.length - 1; i >= 0; i--) {
                const b = bursts[i]; b.age += dt; const P = b.pts.geometry.attributes.position.array;
                for (let j = 0; j < b.V.length; j++) { const v = b.V[j]; v.y -= 1.3 * dt; v.multiplyScalar(0.985); P[j * 3] += v.x * dt; P[j * 3 + 1] += v.y * dt; P[j * 3 + 2] += v.z * dt; }
                b.pts.geometry.attributes.position.needsUpdate = true; b.pts.material.opacity = Math.max(0, 1 - b.age / b.life);
                if (b.age > b.life) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        /* ---------------- Init ---------------- */
        async function init() {
            const fontLoads = ['210px "Great Vibes"', '500 40px Cinzel', '600 60px Cinzel', 'italic 500 52px "Cormorant Garamond"', 'italic 50px "Cormorant Garamond"', '600 72px "Cormorant Garamond"', '48px "Cormorant Garamond"']
                .map(f => document.fonts.load(f));
            await Promise.race([Promise.all(fontLoads).then(() => document.fonts.ready), new Promise(r => setTimeout(r, 3500))]);
            applyTheme(themeName);
            fit();
            envelope.position.set(0, -5, 0); envelope.rotation.set(-1.1, 0.4, 0.2);
            animate();
            setTimeout(() => $('#loader').classList.add('hide'), 200);
            await tween(2000, k => { envelope.position.y = lerp(-5, 0, k); envelope.rotation.set(lerp(-1.1, 0, k), lerp(0.4, 0, k), lerp(0.2, 0, k)); }, easeOutCubic);
            state = 'closed'; updateUI();
        }
        updateUI();
        init();
    </script>
