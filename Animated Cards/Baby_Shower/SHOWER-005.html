<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6EEDF">
    <title>Oh, Baby! · A Baby Shower Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F6EEDF;
            --paper: #FFFDF6;
            --ink: #4A4038;
            --gold: #B08D4F;
            --soft: #9C8A72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            font-family: 'Jost', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: grab
        }

        body.dragging #scene {
            cursor: grabbing
        }

        body.pick #scene {
            cursor: pointer
        }

        /* photographic vignette to frame the scene */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(120% 92% at 50% 42%, rgba(0, 0, 0, 0) 58%, rgba(118, 92, 54, .13) 100%);
        }

        /* stationery hairline frame */
        .frame {
            position: fixed;
            inset: 14px;
            border: 1px solid rgba(176, 141, 79, .5);
            pointer-events: none;
            z-index: 5
        }

        .ui-el {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease, transform 1s ease
        }

        body.ready .ui-el {
            opacity: 1;
            transform: none
        }

        .badge {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translate(-50%, -58%);
            z-index: 6;
            background: var(--bg);
            border: 1px solid rgba(176, 141, 79, .5);
            border-radius: 999px;
            padding: 10px 26px 9px;
            font-size: 10.5px;
            letter-spacing: .34em;
            padding-left: calc(26px + .34em);
            color: #8A6B3F;
            white-space: nowrap;
            transition-delay: .15s;
        }

        .corner {
            position: fixed;
            bottom: 26px;
            z-index: 6;
            pointer-events: none;
            font-size: 9.5px;
            letter-spacing: .28em;
            color: var(--soft);
            white-space: nowrap;
            transition-delay: .45s;
        }

        .cl {
            left: 32px
        }

        .cr {
            right: 32px;
            letter-spacing: .26em
        }

        #toggleBtn {
            position: fixed;
            left: 50%;
            bottom: 46px;
            transform: translateX(-50%);
            z-index: 7;
            background: var(--paper);
            border: 1px solid rgba(176, 141, 79, .65);
            border-radius: 2px;
            color: var(--ink);
            font-family: 'Jost', sans-serif;
            font-weight: 400;
            font-size: 11px;
            letter-spacing: .3em;
            padding: 15px 30px 14px calc(30px + .3em);
            cursor: pointer;
            transition: background .35s ease, border-color .35s ease, opacity 1s ease, transform .2s ease, translate 1s ease;
            box-shadow: 0 12px 32px rgba(120, 90, 50, .14);
            transition-delay: .3s;
        }

        body.ready #toggleBtn {
            transform: translateX(-50%)
        }

        #toggleBtn:hover {
            background: #F6EAD2;
            border-color: #9A7A3F
        }

        #toggleBtn:active {
            transform: translateX(-50%) scale(.965)
        }

        #veil {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 1.1s ease .15s;
        }

        #veil.hidden {
            opacity: 0;
            pointer-events: none
        }

        .v-mono {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 46px;
            color: var(--ink)
        }

        .v-sub {
            font-size: 9.5px;
            letter-spacing: .42em;
            color: var(--soft);
            animation: pulse 1.7s ease-in-out infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .35
            }

            50% {
                opacity: 1
            }
        }

        @media (max-width:720px) {
            .corner {
                display: none
            }

            #toggleBtn {
                bottom: 34px
            }
        }

        @media (max-width:480px) {
            .badge {
                font-size: 9px;
                letter-spacing: .26em;
                padding: 8px 18px 7px calc(18px + .26em)
            }

            #toggleBtn {
                font-size: 10px;
                padding: 13px 20px 12px calc(20px + .3em)
            }
        }
    </style>
</head>

<body>

    <canvas id="scene"></canvas>

    <div id="veil">
        <div class="v-mono">S &amp; J</div>
        <div class="v-sub" id="veilText">UNSEALING YOUR INVITATION</div>
    </div>

    <div class="frame ui-el"></div>
    <div class="badge ui-el">S &amp; J &nbsp;·&nbsp; A BABY SHOWER</div>
    <div class="corner cl ui-el" id="hint">DRAG TO ORBIT &nbsp;·&nbsp; SCROLL TO ZOOM &nbsp;·&nbsp; TAP THE CARD &amp;
        CHARMS</div>
    <div class="corner cr ui-el">BABY ROSE &nbsp;·&nbsp; ARRIVING AUTUMN ’25</div>
    <button id="toggleBtn" class="ui-el" aria-label="Open the invitation">OPEN THE INVITATION</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        /* ---------------- palette ---------------- */
        const PAL = {
            bg: '#F6EEDF', ink: '#4A4038', gold: '#B08D4F', goldSoft: '#C9A961',
            blush: '#E8B7AE', blushDeep: '#D89AA0', sage: '#A9BCA4',
            ivory: '#FFF7EA', paper: '#FFFDF6'
        };
        const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

        /* ---------------- renderer / scene ---------------- */
        const canvas = document.getElementById('scene');
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        } catch (e) {
            document.getElementById('veilText').textContent = 'SORRY — THIS BROWSER CANNOT OPEN THE CARD (WEBGL NEEDED)';
            throw e;
        }
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PAL.bg);
        scene.fog = new THREE.Fog(PAL.bg, 11, 30);

        const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
        camera.position.set(-7, 6.5, 13);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true; controls.dampingFactor = .06;
        controls.enablePan = false;
        controls.rotateSpeed = .55; controls.zoomSpeed = .8;
        controls.minDistance = 4.2; controls.maxDistance = 13;
        controls.minPolarAngle = .5; controls.maxPolarAngle = 1.72;
        controls.target.set(0, 1.45, 0);
        controls.enabled = false;
        let userInteracted = false;
        controls.addEventListener('start', () => { userInteracted = true; document.body.classList.add('dragging'); });
        controls.addEventListener('end', () => document.body.classList.remove('dragging'));

        /* ---------------- lights ---------------- */
        scene.add(new THREE.HemisphereLight(0xfff6e6, 0xe6cdc4, .85));
        const sun = new THREE.DirectionalLight(0xfff1da, 1.5);
        sun.position.set(5, 8, 6);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
        sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -5;
        sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
        sun.shadow.camera.updateProjectionMatrix();
        sun.shadow.bias = -0.0004;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xffe9e2, .4);
        fill.position.set(-6, 3, 4); scene.add(fill);
        const blushL = new THREE.PointLight(0xf3c9bd, .55, 30);
        blushL.position.set(-4, 2, -4); scene.add(blushL);

        /* ---------------- soft sprite texture (particles / haze) ---------------- */
        function radialTex() {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const x = c.getContext('2d');
            const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(.45, 'rgba(255,255,255,.55)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            x.fillStyle = g; x.fillRect(0, 0, 128, 128);
            const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
        }
        const glowTex = radialTex();

        /* warm haze behind the composition — reads as light, not decoration */
        const haze = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTex, color: 0xf0cdbf, transparent: true, opacity: .45, depthWrite: false
        }));
        haze.scale.set(14, 10, 1); haze.position.set(0, 1.4, -6); scene.add(haze);

        /* drifting golden dust */
        const N = 90, pArr = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) {
            pArr[i * 3] = (Math.random() - .5) * 13;
            pArr[i * 3 + 1] = Math.random() * 6.5 - 1;
            pArr[i * 3 + 2] = Math.random() * 9 - 7;
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
            map: glowTex, color: 0xd9b57a, size: .09, transparent: true, opacity: .75, depthWrite: false
        }));
        scene.add(dust);

        /* ---------------- shared materials ---------------- */
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xfffdf5, roughness: 1 });
        const goldMat = new THREE.MeshStandardMaterial({ color: PAL.goldSoft, metalness: .7, roughness: .32 });
        const blushMat = new THREE.MeshStandardMaterial({ color: PAL.blushDeep, roughness: .55 });
        const ivoryMat = new THREE.MeshStandardMaterial({ color: PAL.ivory, roughness: .9 });
        const sageMat = new THREE.MeshStandardMaterial({ color: PAL.sage, roughness: .95 });
        const inkMat = new THREE.MeshStandardMaterial({ color: PAL.ink, roughness: .6 });
        const stringMat = new THREE.MeshStandardMaterial({ color: 0xbfae94, roughness: .9 });
        const wickerMat = new THREE.MeshStandardMaterial({ color: 0xc79a66, roughness: .85 });
        const sphereGeo = new THREE.SphereGeometry(1, 20, 14);

        /* ---------------- small helpers ---------------- */
        function strut(a, b, r, mat) {
            const d = b.clone().sub(a), l = d.length();
            const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l, 8), mat);
            m.position.copy(a).addScaledVector(d, .5);
            m.quaternion.setFromUnitVectors(v3(0, 1, 0), d.normalize());
            return m;
        }
        function starShape(R = .3, r = .125, pts = 5) {
            const s = new THREE.Shape();
            for (let i = 0; i < pts * 2; i++) {
                const a = Math.PI * i / pts - Math.PI / 2, rad = i % 2 ? r : R;
                const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
                i ? s.lineTo(x, y) : s.moveTo(x, y);
            }
            s.closePath(); return s;
        }
        function heartShape() {
            const s = new THREE.Shape();
            s.moveTo(0, .25);
            s.bezierCurveTo(0, .29, -.06, .33, -.14, .33);
            s.bezierCurveTo(-.30, .33, -.34, .18, -.34, .11);
            s.bezierCurveTo(-.34, -.02, -.23, -.13, 0, -.31);
            s.bezierCurveTo(.23, -.13, .34, -.02, .34, .11);
            s.bezierCurveTo(.34, .18, .30, .33, .14, .33);
            s.bezierCurveTo(.06, .33, 0, .29, 0, .25);
            return s;
        }
        function crescentShape() {
            const s = new THREE.Shape();
            const th = Math.acos(.28);                       // cusp angle on outer circle
            s.absarc(0, 0, .5, th, Math.PI * 2 - th, false);      // big left arc
            s.absarc(.28, 0, .5, -(Math.PI - th), (Math.PI - th), true); // inner arc back
            s.closePath(); return s;
        }
        const starGeo = new THREE.ExtrudeGeometry(starShape(), { depth: .09, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 2 }); starGeo.center();
        const heartGeo = new THREE.ExtrudeGeometry(heartShape(), { depth: .1, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 2 }); heartGeo.center();
        const moonGeo = new THREE.ExtrudeGeometry(crescentShape(), { depth: .07, bevelEnabled: true, bevelThickness: .015, bevelSize: .015, bevelSegments: 2 }); moonGeo.center();

        /* ---------------- clouds ---------------- */
        function makeCloud({ n = 6, spread = 1.6, r = .55, squash = .6, shadow = false } = {}) {
            const g = new THREE.Group();
            for (let i = 0; i < n; i++) {
                const m = new THREE.Mesh(sphereGeo, cloudMat);
                m.position.set((Math.random() - .5) * 2 * spread, (Math.random() - .4) * r * .8, (Math.random() - .5) * spread);
                const s = r * (.55 + Math.random() * .7);
                m.scale.set(s, s * squash, s);
                m.receiveShadow = shadow;
                g.add(m);
            }
            return g;
        }
        /* cloud floor — grounds the diorama, catches soft shadows */
        const floor = makeCloud({ n: 9, spread: 3.4, r: 1.0, squash: .5, shadow: true });
        floor.position.set(0, -1.75, 0); scene.add(floor);

        const drifts = [];
        function addCloud(x, y, z, s, o) {
            const c = makeCloud(o || { n: 6, spread: 1.4, r: .5 });
            c.position.set(x, y, z); c.scale.setScalar(s); scene.add(c);
            drifts.push({ c, bx: x, sp: .05 + Math.random() * .08, ph: Math.random() * 6.28, range: .8 + Math.random() * .9 });
        }
        addCloud(3.2, .6, -3.4, 1.2, { n: 7, spread: 1.8, r: .6 });
        addCloud(-3.4, 1.6, -5.0, 1.5);
        addCloud(1.2, 4.6, -7.0, 1.1);
        addCloud(-1.8, 3.1, -7.5, .9);
        addCloud(5.2, 2.6, -6.5, 1.3);
        addCloud(-5.6, .4, -5.5, 1.4);

        /* ---------------- the crib mobile (centerpiece) ---------------- */
        const pickables = [];
        const mobile = new THREE.Group(); scene.add(mobile);
        const spin = new THREE.Group(); mobile.add(spin);

        const mCloud = makeCloud({ n: 5, spread: .8, r: .34, squash: .7 });
        mCloud.position.y = 3.85;
        mCloud.traverse(o => { if (o.isMesh) o.castShadow = true; });
        mobile.add(mCloud);
        mobile.add(strut(v3(0, 3.8, 0), v3(0, 3.15, 0), .012, stringMat));

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, 2.9, 10), goldMat);
        bar.rotation.z = Math.PI / 2; bar.position.y = 3.15; bar.castShadow = true; spin.add(bar);
        [-1.45, 1.45].forEach(x => {
            const cap = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), goldMat);
            cap.position.set(x, 3.15, 0); spin.add(cap);
        });

        function makeElephant() {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(.24, 22, 16), sageMat);
            body.scale.set(1, .95, 1.2); body.position.y = -.28; g.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(.185, 20, 14), sageMat);
            head.position.set(0, -.12, .30); g.add(head);
            [-1, 1].forEach(s => {
                const e = new THREE.Mesh(new THREE.SphereGeometry(.15, 16, 12), sageMat);
                e.scale.set(.3, 1, 1.05); e.position.set(s * .17, -.09, .26); e.rotation.y = s * .45; g.add(e);
                const eye = new THREE.Mesh(new THREE.SphereGeometry(.022, 8, 8), inkMat);
                eye.position.set(s * .08, -.07, .47); g.add(eye);
                const cheek = new THREE.Mesh(new THREE.SphereGeometry(.035, 8, 8), blushMat);
                cheek.position.set(s * .125, -.17, .46); g.add(cheek);
            });
            const curve = new THREE.CatmullRomCurve3([v3(0, -.08, .44), v3(0, -.18, .50), v3(0, -.30, .46), v3(0, -.34, .38)]);
            g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, .04, 8), sageMat));
            const tip = new THREE.Mesh(new THREE.SphereGeometry(.045, 8, 8), sageMat);
            tip.position.set(0, -.34, .38); g.add(tip);
            [[-.13, .14], [.13, .14], [-.13, -.14], [.13, -.14]].forEach(([lx, lz]) => {
                const l = new THREE.Mesh(new THREE.CylinderGeometry(.055, .062, .16, 10), sageMat);
                l.position.set(lx, -.5, lz); g.add(l);
            });
            const tail = new THREE.Mesh(new THREE.CylinderGeometry(.015, .02, .16, 6), sageMat);
            tail.position.set(0, -.3, -.3); tail.rotation.x = .35; g.add(tail);
            return g;
        }
        function makeStarCharm() {
            const g = new THREE.Group();
            const m = new THREE.Mesh(starGeo, goldMat); m.position.y = -.32; m.rotation.z = .15; g.add(m);
            return g;
        }
        function makeMoonCharm() {
            const g = new THREE.Group();
            const m = new THREE.Mesh(moonGeo, ivoryMat); m.position.y = -.35; m.rotation.z = -.5; g.add(m);
            return g;
        }
        function makeHeartCharm() {
            const g = new THREE.Group();
            const m = new THREE.Mesh(heartGeo, blushMat); m.position.y = -.36; m.rotation.z = .2; g.add(m);
            return g;
        }
        function makeCloudCharm() {
            const g = new THREE.Group();
            [[-.11, -.28, .09], [0, -.32, .13], [.11, -.28, .09]].forEach(([px, py, pr]) => {
                const m = new THREE.Mesh(sphereGeo, ivoryMat);
                m.position.set(px, py, 0); m.scale.set(pr, pr * .72, pr); g.add(m);
            });
            return g;
        }
        const charmDefs = [
            { x: -1.20, len: 1.00, make: makeElephant },
            { x: -0.60, len: 1.35, make: makeStarCharm },
            { x: 0.00, len: 0.85, make: makeMoonCharm },
            { x: 0.60, len: 1.20, make: makeHeartCharm },
            { x: 1.20, len: 1.00, make: makeCloudCharm },
        ];
        const charms = [];
        charmDefs.forEach((d, i) => {
            const pivot = new THREE.Group(); pivot.position.set(d.x, 3.15, 0); spin.add(pivot);
            const str = new THREE.Mesh(new THREE.CylinderGeometry(.005, .005, d.len, 6), stringMat);
            str.position.y = -d.len / 2; pivot.add(str);
            const body = d.make(); body.position.y = -d.len; pivot.add(body);
            body.traverse(o => {
                if (o.isMesh) { o.castShadow = true; o.userData = { type: 'charm', idx: i }; pickables.push(o); }
            });
            charms.push({ pivot, a: 0, v: (Math.random() - .5) * .4, phase: Math.random() * 6.28, k: 7 + Math.random() * 2, damp: 1.5 });
        });

        /* ---------------- hot air balloons ---------------- */
        function stripesTex() {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const x = c.getContext('2d');
            const cols = ['#E8B7AE', '#FFF7EA', '#A9BCA4', '#FFF7EA', '#D9B36A', '#FFF7EA', '#E8B7AE', '#FFF7EA'];
            cols.forEach((col, i) => { x.fillStyle = col; x.fillRect(i * 32, 0, 32, 256); });
            const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
        }
        const stripeTex = stripesTex();
        const balloons = [];
        function makeBalloon(scale) {
            const g = new THREE.Group();
            const env = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 22),
                new THREE.MeshStandardMaterial({ map: stripeTex, roughness: .55 }));
            env.scale.set(1, 1.12, 1); env.castShadow = true; g.add(env);
            const collar = new THREE.Mesh(new THREE.CylinderGeometry(.2, .24, .22, 12), goldMat);
            collar.position.y = -1.13; g.add(collar);
            const basket = new THREE.Mesh(new THREE.CylinderGeometry(.17, .135, .2, 10), wickerMat);
            basket.position.y = -1.66; basket.castShadow = true; g.add(basket);
            [[.15, .15], [-.15, .15], [.15, -.15], [-.15, -.15]].forEach(([sx, sz]) => {
                g.add(strut(v3(sx, -1.2, sz), v3(sx * .8, -1.56, sz * .8), .006, stringMat));
            });
            g.scale.setScalar(scale);
            return g;
        }
        function addBalloon(x, y, z, s, idx) {
            const g = makeBalloon(s); g.position.set(x, y, z); scene.add(g);
            g.traverse(o => { if (o.isMesh) o.userData = { type: 'balloon', idx }; });
            env_and_basket: {
                g.children.forEach(o => { if (o.isMesh) pickables.push(o); });
            }
            balloons.push({ g, bx: x, by: y, ph: Math.random() * 6.28, hop: 0, s });
        }
        addBalloon(-3.3, 2.5, -2.8, .95, 0);
        addBalloon(3.7, 3.4, -7.0, .50, 1);

        function balloonPop(i) {
            const b = balloons[i];
            gsap.fromTo(b, { hop: 0 }, { hop: .55, duration: .24, ease: 'power2.out', yoyo: true, repeat: 1 });
            gsap.fromTo(b.g.scale, { x: b.s, y: b.s, z: b.s }, { x: b.s * 1.07, y: b.s * 1.07, z: b.s * 1.07, duration: .18, ease: 'power2.out', yoyo: true, repeat: 1 });
            burst(b.g.position, { count: 40, speed: 2.4, up: 2.8, grav: 2.2, life: 2 });
        }

        /* ---------------- floating hearts ---------------- */
        const heartColors = [PAL.blush, PAL.sage, PAL.blushDeep];
        const hearts = [];
        for (let i = 0; i < 6; i++) {
            const m = new THREE.Mesh(heartGeo, new THREE.MeshStandardMaterial({ color: heartColors[i % 3], roughness: .7 }));
            const s = .42 + Math.random() * .3; m.scale.setScalar(s); m.rotation.z = (Math.random() - .5) * .3;
            m.position.set((Math.random() < .5 ? -1 : 1) * (3.5 + Math.random() * 2), -1 + Math.random() * 4, -3 - Math.random() * 3);
            scene.add(m);
            hearts.push({ m, bx: m.position.x, sp: .1 + Math.random() * .12, ph: Math.random() * 6.28, rot: .2 + Math.random() * .4 });
        }

        /* ---------------- paper confetti / sparkle bursts ---------------- */
        const parts = [];
        const confGeoA = new THREE.PlaneGeometry(.06, .095);
        const confGeoB = new THREE.CircleGeometry(.03, 10);
        const confColors = ['#E8B7AE', '#D89AA0', '#A9BCA4', '#D9B36A', '#FFF1D6', '#B08D4F'];
        const goldColors = ['#D9B36A', '#E9C87E', '#FFF3D0', '#E8B7AE'];
        function burst(origin, { count = 36, speed = 2.2, up = 2.4, grav = 2.2, life = 2, colors = confColors, size = 1 } = {}) {
            for (let i = 0; i < count; i++) {
                const geo = Math.random() < .55 ? confGeoA : confGeoB;
                const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                    color: colors[i % colors.length], side: THREE.DoubleSide, transparent: true
                }));
                m.position.copy(origin).add(v3((Math.random() - .5) * .4, (Math.random() - .5) * .2, (Math.random() - .5) * .4));
                m.rotation.set(Math.random() * 3.14, Math.random() * 3.14, Math.random() * 3.14);
                m.scale.setScalar(size * (.7 + Math.random() * .6));
                scene.add(m);
                parts.push({
                    m, grav,
                    vel: v3((Math.random() - .5) * speed, (Math.random() * .7 + .3) * up, (Math.random() - .5) * speed),
                    av: { x: (Math.random() - .5) * 8, y: (Math.random() - .5) * 8, z: (Math.random() - .5) * 8 },
                    life: life * (.6 + Math.random() * .5)
                });
            }
        }

        /* ---------------- the invitation card (canvas typesetting) ---------------- */
        const CARD_W = 1.7, CARD_H = 2.35, CARD_T = .05;
        const cardGroup = new THREE.Group(); cardGroup.position.set(0, .55, 0); scene.add(cardGroup);
        let hinge = null, cardOpen = false;

        function cardTexture(draw) {
            const c = document.createElement('canvas'); c.width = 880; c.height = 1216;
            const x = c.getContext('2d'); draw(x, 880, 1216);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return t;
        }
        function rr(x, px, py, pw, ph, r) {
            x.beginPath();
            x.moveTo(px + r, py);
            x.arcTo(px + pw, py, px + pw, py + ph, r);
            x.arcTo(px + pw, py + ph, px, py + ph, r);
            x.arcTo(px, py + ph, px, py, r);
            x.arcTo(px, py, px + pw, py, r);
            x.closePath();
        }
        function paper(x, w, h) {
            x.fillStyle = PAL.paper; x.fillRect(0, 0, w, h);
            for (let i = 0; i < 900; i++) {
                x.fillStyle = `rgba(122,101,70,${Math.random() * .045})`;
                const s = Math.random() * 1.4 + .3;
                x.fillRect(Math.random() * w, Math.random() * h, s, s);
            }
        }
        function borders(x, w, h) {
            x.strokeStyle = 'rgba(176,141,79,.9)'; x.lineWidth = 3; rr(x, 30, 30, w - 60, h - 60, 14); x.stroke();
            x.strokeStyle = 'rgba(176,141,79,.5)'; x.lineWidth = 1; rr(x, 40, 40, w - 80, h - 80, 9); x.stroke();
        }
        function tracked(x, text, cx, y, font, color, ls) {
            x.font = font; x.fillStyle = color; x.textAlign = 'left';
            const chars = [...text], ws = chars.map(c => x.measureText(c).width);
            const total = ws.reduce((a, b) => a + b, 0) + ls * (chars.length - 1);
            let px = cx - total / 2;
            chars.forEach((c, i) => { x.fillText(c, px, y); px += ws[i] + ls; });
        }
        function line(x, text, cx, y, font, color) {
            x.font = font; x.fillStyle = color; x.textAlign = 'center';
            x.fillText(text, cx, y);
        }
        function hair(x, x1, y, x2, col = 'rgba(74,64,56,.28)', w = 1) {
            x.strokeStyle = col; x.lineWidth = w;
            x.beginPath(); x.moveTo(x1, y); x.lineTo(x2, y); x.stroke();
        }
        function sparkle(x, cx, cy, r, color, alpha = 1) {
            x.save(); x.translate(cx, cy); x.fillStyle = color; x.globalAlpha = alpha;
            x.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = Math.PI * i / 4 - Math.PI / 2, rad = i % 2 ? r * .3 : r;
                const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
                i ? x.lineTo(px, py) : x.moveTo(px, py);
            }
            x.closePath(); x.fill(); x.restore();
        }
        function sprig(x, cx, cy) {
            x.strokeStyle = '#8FA687'; x.lineWidth = 3; x.lineCap = 'round';
            x.beginPath(); x.moveTo(cx - 72, cy); x.quadraticCurveTo(cx, cy + 26, cx + 72, cy); x.stroke();
            for (let i = 1; i <= 6; i++) {
                const t = i / 7, px = cx - 72 + 144 * t, py = cy + 52 * t * (1 - t), side = i % 2 ? 1 : -1;
                x.save(); x.translate(px, py); x.rotate(side * .35);
                x.fillStyle = i % 2 ? '#8FA687' : '#7E9878';
                x.beginPath(); x.ellipse(0, side * 13, 6.5, 14, 0, 0, Math.PI * 2); x.fill();
                x.restore();
            }
            x.fillStyle = '#C9A961';
            [[-72, cy], [72, cy]].forEach(([px, py]) => { x.beginPath(); x.arc(px, py, 5, 0, Math.PI * 2); x.fill(); });
            sparkle(x, cx, cy - 26, 12, '#C9A961', .9);
        }

        function drawFront(x, w, h) {
            paper(x, w, h); borders(x, w, h); const cx = w / 2;
            [[70, 70], [w - 70, 70], [70, h - 70], [w - 70, h - 70]].forEach(([px, py]) => sparkle(x, px, py, 8, '#C9A961', .75));
            tracked(x, 'YOU ARE WARMLY INVITED', cx, 318, '400 17px Jost', '#A88746', 13);
            tracked(x, 'TO AN AFTERNOON BABY SHOWER', cx, 352, '400 17px Jost', '#A88746', 13);
            sparkle(x, cx, 460, 20, '#C9A961', .95);
            sparkle(x, cx - 52, 460, 8, '#C9A961', .55);
            sparkle(x, cx + 52, 460, 8, '#C9A961', .55);
            line(x, 'Oh, Baby!', cx, 652, 'italic 600 132px "Cormorant Garamond"', '#4A4038');
            hair(x, cx - 70, 725, cx + 70);
            line(x, 'an afternoon for the parents-to-be', cx, 790, 'italic 400 33px "Cormorant Garamond"', '#7A6C5C');
            tracked(x, 'SATURDAY · JUNE THE FOURTEENTH', cx, 962, '400 13.5px Jost', '#4A4038', 9);
            sparkle(x, cx, 1008, 9, '#C9A961', .8);
        }
        function drawInsideLeft(x, w, h) {
            paper(x, w, h); borders(x, w, h); const cx = w / 2;
            sprig(x, cx, 300);
            let y = 436;
            const L = (t, f, dy) => { line(x, t, cx, y, f, '#4A4038'); y += dy; };
            L('Please join us for an afternoon', 'italic 400 41px "Cormorant Garamond"', 66);
            L('of sweetness, games & laughter,', 'italic 400 41px "Cormorant Garamond"', 66);
            L('as we await, with full hearts,', 'italic 400 41px "Cormorant Garamond"', 88);
            L('the littlest Rose', '600 62px "Cormorant Garamond"', 96);
            L('before she makes her debut.', 'italic 400 41px "Cormorant Garamond"', 70);
            sparkle(x, cx, 796, 13, '#C9A961', .85);
            line(x, 'games, cake & tiny socks await', cx, 980, 'italic 400 31px "Cormorant Garamond"', '#7A6C5C');
            tracked(x, 'HOSTED WITH LOVE', cx, 1046, '400 12px Jost', '#A88746', 11);
        }
        function drawInsideRight(x, w, h) {
            paper(x, w, h); borders(x, w, h); const cx = w / 2;
            tracked(x, 'BABY SHOWER', cx, 200, '400 15px Jost', '#A88746', 12);
            hair(x, cx - 60, 232, cx + 60, 'rgba(176,141,79,.8)');
            line(x, 'in honor of', cx, 298, 'italic 400 32px "Cormorant Garamond"', '#7A6C5C');
            line(x, 'Sarah & James', cx, 362, '600 58px "Cormorant Garamond"', '#4A4038');
            const rows = [
                ['WHEN', ['Saturday, June the 14th']],
                ['TIME', ['Two until four in the afternoon']],
                ['WHERE', ['The Garden Pavilion', '12 Willow Lane']],
                ['RSVP', ['Margaret · (555) 012-6789', 'by the first of June']],
            ];
            let y = 424;
            rows.forEach(([lab, vals], ri) => {
                tracked(x, lab, cx, y, '400 12.5px Jost', '#A88746', 8);
                y += 36;
                vals.forEach(v => { line(x, v, cx, y, '400 30px "Cormorant Garamond"', '#4A4038'); y += 38; });
                y += 4;
                if (ri < rows.length - 1) hair(x, cx - 180, y, cx + 180, 'rgba(74,64,56,.14)');
                y += 28;
            });
            line(x, 'we can’t wait to meet you, little one', cx, 952, 'italic 400 30px "Cormorant Garamond"', '#7A6C5C');
            tracked(x, 'BABY ROSE · ARRIVING AUTUMN ’25', cx, 1010, '400 12px Jost', '#A88746', 10);
            sparkle(x, cx, 1054, 9, '#C9A961', .8);
        }
        function drawBack(x, w, h) {
            paper(x, w, h); borders(x, w, h); const cx = w / 2;
            for (let i = 0; i < 30; i++) {
                const cols = ['#C9A961', '#C9A961', '#C9A961', '#E8B7AE', '#A9BCA4'];
                sparkle(x, 90 + Math.random() * (h - 180), 90 + Math.random() * (h - 180),
                    3 + Math.random() * 7, cols[i % cols.length], .18 + Math.random() * .5);
            }
            tracked(x, 'WITH LOVE', cx, h - 160, '400 11px Jost', '#A88746', 10);
            line(x, 'until we meet you, little one', cx, h - 116, 'italic 400 26px "Cormorant Garamond"', '#9C8A72');
        }

        async function waitFonts() {
            try {
                await Promise.race([
                    Promise.all([
                        document.fonts.load('italic 600 132px "Cormorant Garamond"'),
                        document.fonts.load('600 62px "Cormorant Garamond"'),
                        document.fonts.load('italic 400 41px "Cormorant Garamond"'),
                        document.fonts.load('400 30px "Cormorant Garamond"'),
                        document.fonts.load('400 17px Jost'),
                    ]),
                    new Promise(r => setTimeout(r, 3500))
                ]);
            } catch (e) {/* fall back to default fonts */ }
        }

        function buildCard() {
            const edge = new THREE.MeshStandardMaterial({ color: 0xEFE5D0, roughness: .95 });
            const matF = new THREE.MeshStandardMaterial({ map: cardTexture(drawFront), roughness: .92 });
            const matIL = new THREE.MeshStandardMaterial({ map: cardTexture(drawInsideLeft), roughness: .92 });
            const matIR = new THREE.MeshStandardMaterial({ map: cardTexture(drawInsideRight), roughness: .92 });
            const matB = new THREE.MeshStandardMaterial({ map: cardTexture(drawBack), roughness: .92 });

            const base = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T),
                [edge, edge, edge, edge, matIR, matB]);
            base.castShadow = true; base.userData = { type: 'card' }; cardGroup.add(base);

            hinge = new THREE.Group();
            hinge.position.set(-CARD_W / 2, 0, CARD_T / 2 + .002);
            cardGroup.add(hinge);

            const cover = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T),
                [edge, edge, edge, edge, matF, matIL]);
            cover.position.x = CARD_W / 2;
            cover.castShadow = true; cover.userData = { type: 'card' };
            hinge.add(cover);

            pickables.push(base, cover);
        }

        /* ---------------- camera framing ---------------- */
        function homePos() {
            const a = innerWidth / innerHeight;
            const f = a < .75 ? 1.5 : a < 1.05 ? 1.28 : a < 1.5 ? 1.1 : 1;
            return v3(0, 1.95, 7.6 * f);
        }

        /* ---------------- open / close ---------------- */
        const btn = document.getElementById('toggleBtn');
        function setOpen(open) {
            if (open === cardOpen || !hinge) return;
            cardOpen = open;
            btn.textContent = open ? 'CLOSE THE CARD' : 'OPEN THE INVITATION';
            btn.setAttribute('aria-label', open ? 'Close the invitation' : 'Open the invitation');
            controls.autoRotate = false; controls.enabled = false;

            gsap.to(hinge.rotation, { y: open ? -2.9 : 0, duration: 1.35, ease: 'power3.inOut' });
            gsap.to(cardGroup.rotation, { z: open ? .05 : 0, duration: .9, ease: 'power2.out' });

            const hp = homePos();
            const tp = open ? v3(0, hp.y - 0.7, hp.z * .8) : hp;
            gsap.to(camera.position, { x: tp.x, y: tp.y, z: tp.z, duration: 1.7, ease: 'power2.inOut' });
            gsap.to(controls.target, { y: open ? 0.95 : 1.45, duration: 1.5, ease: 'power2.inOut' });
            gsap.delayedCall(1.7, () => {
                controls.enabled = true; controls.autoRotate = true;
                controls.autoRotateSpeed = open ? .28 : .5;
            });

            if (open) {
                charms.forEach(c => c.v += (Math.random() - .5) * 2.4);
                burst(v3(0, 1.85, .3), { colors: goldColors, count: 34, speed: 1.5, up: 2.4, grav: 1.0, life: 1.7, size: .8 });
            }
        }
        btn.addEventListener('click', () => setOpen(!cardOpen));

        /* ---------------- pointer interaction ---------------- */
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2(-2, -2);
        let downPos = null, prevHover = null;
        function setNdc(e) {
            ndc.x = (e.clientX / innerWidth) * 2 - 1;
            ndc.y = -(e.clientY / innerHeight) * 2 + 1;
        }
        canvas.addEventListener('pointermove', setNdc);
        canvas.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
        canvas.addEventListener('pointerup', e => {
            if (!downPos) return;
            const dx = e.clientX - downPos[0], dy = e.clientY - downPos[1];
            downPos = null;
            if (dx * dx + dy * dy > 36) return;
            setNdc(e);
            raycaster.setFromCamera(ndc, camera);
            const hit = raycaster.intersectObjects(pickables, false)[0];
            if (!hit) return;
            const ud = hit.object.userData;
            if (ud.type === 'card') setOpen(!cardOpen);
            else if (ud.type === 'balloon') balloonPop(ud.idx);
            else if (ud.type === 'charm') {
                const c = charms[ud.idx];
                c.v += (Math.random() < .5 ? -1 : 1) * (1.3 + Math.random());
            }
        });

        /* ---------------- resize ---------------- */
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            if (!userInteracted && !cardOpen) camera.position.copy(homePos());
        });
        if (matchMedia('(pointer:coarse)').matches)
            document.getElementById('hint').textContent = 'DRAG TO ORBIT · PINCH TO ZOOM · TAP THE CARD';

        /* ---------------- main loop ---------------- */
        const clock = new THREE.Clock();
        function tick() {
            requestAnimationFrame(tick);
            const dt = Math.min(clock.getDelta(), .05);
            const t = clock.elapsedTime;

            controls.update();

            /* mobile spin + pendulum physics */
            spin.rotation.y = t * .1;
            mCloud.position.y = 3.85 + Math.sin(t * .5) * .05;
            charms.forEach(c => {
                c.v += (Math.sin(t * .7 + c.phase) * .22 - c.k * c.a - c.damp * c.v) * dt;
                c.a += c.v * dt;
                c.pivot.rotation.x = c.a;
                c.pivot.rotation.z = Math.sin(t * .55 + c.phase) * .06;
            });

            /* card idle float */
            cardGroup.position.y = .55 + Math.sin(t * .8) * .05;
            cardGroup.rotation.y = Math.sin(t * .3) * .03;

            /* balloons */
            balloons.forEach(b => {
                b.g.position.y = b.by + Math.sin(t * .45 + b.ph) * .18 + b.hop;
                b.g.position.x = b.bx + Math.sin(t * .18 + b.ph) * .35;
                b.g.rotation.y = Math.sin(t * .12 + b.ph) * .15;
            });

            /* clouds drift */
            drifts.forEach(d => { d.c.position.x = d.bx + Math.sin(t * d.sp + d.ph) * d.range; });

            /* hearts rise */
            hearts.forEach(hh => {
                hh.m.position.y += hh.sp * dt;
                hh.m.position.x = hh.bx + Math.sin(t * .3 + hh.ph) * .5;
                hh.m.rotation.y += hh.rot * dt;
                if (hh.m.position.y > 4.6) {
                    hh.m.position.y = -1.6;
                    hh.bx = (Math.random() < .5 ? -1 : 1) * (3.5 + Math.random() * 2);
                    hh.m.position.z = -3 - Math.random() * 3;
                }
            });

            /* dust */
            dust.rotation.y = t * .02;
            dust.position.y = Math.sin(t * .4) * .15;

            /* confetti */
            for (let i = parts.length - 1; i >= 0; i--) {
                const p = parts[i];
                p.vel.y -= p.grav * dt;
                p.vel.multiplyScalar(Math.max(0, 1 - 1.1 * dt));
                p.m.position.addScaledVector(p.vel, dt);
                p.m.rotation.x += p.av.x * dt; p.m.rotation.y += p.av.y * dt; p.m.rotation.z += p.av.z * dt;
                p.life -= dt;
                p.m.material.opacity = THREE.MathUtils.clamp(p.life / .7, 0, 1);
                if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
            }

            /* hover cursor + card lift */
            if (ndc.x > -1.5) {
                raycaster.setFromCamera(ndc, camera);
                const hit = raycaster.intersectObjects(pickables, false)[0];
                const type = hit ? hit.object.userData.type : null;
                document.body.classList.toggle('pick', !!hit);
                if (type !== prevHover) {
                    if (prevHover === 'card')
                        gsap.to(cardGroup.scale, { x: 1, y: 1, z: 1, duration: .5, ease: 'power2.out' });
                    if (type === 'card')
                        gsap.to(cardGroup.scale, { x: 1.02, y: 1.02, z: 1.02, duration: .4, ease: 'power2.out' });
                    prevHover = type;
                }
            }

            renderer.render(scene, camera);
        }
        tick();

        /* ---------------- intro sequence ---------------- */
        (async () => {
            await waitFonts();
            buildCard();
            renderer.render(scene, camera);            // pre-render behind the veil
            const veil = document.getElementById('veil');
            veil.classList.add('hidden');
            document.body.classList.add('ready');
            const hp = homePos();
            gsap.to(camera.position, {
                x: hp.x, y: hp.y, z: hp.z,
                duration: 2.6, delay: .45, ease: 'power3.inOut',
                onComplete: () => {
                    controls.enabled = true;
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = .5;
                }
            });
        })();
    </script>
</body>
