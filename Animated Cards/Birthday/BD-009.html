<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Georgia', serif;
            background: #0d0a0b;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            z-index: 10;
        }

        .invitation-card {
            background: linear-gradient(135deg, rgba(255, 215, 140, 0.15) 0%, rgba(200, 80, 90, 0.12) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 140, 0.3);
            border-radius: 24px;
            padding: 40px 60px;
            text-align: center;
            pointer-events: auto;
            transform: translateY(100px);
            opacity: 0;
            animation: slideUp 1.2s ease-out 1s forwards;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(255, 180, 100, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .invitation-card h1 {
            font-size: 2.8rem;
            color: #ffd4a3;
            margin-bottom: 16px;
            text-shadow: 0 2px 20px rgba(255, 180, 100, 0.5);
            letter-spacing: 4px;
            font-weight: normal;
        }

        .invitation-card .name {
            font-size: 1.6rem;
            color: #f5e6d3;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .invitation-card .details {
            color: #c9a882;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .rsvp-btn {
            background: linear-gradient(135deg, #e85a4f 0%, #c94c42 100%);
            color: #fff;
            border: none;
            padding: 14px 45px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            box-shadow: 0 8px 30px rgba(232, 90, 79, 0.4);
        }

        .rsvp-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(232, 90, 79, 0.6);
        }

        .hint {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 212, 163, 0.6);
            font-size: 0.85rem;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .invitation-card {
                padding: 30px 35px;
                margin: 20px;
            }

            .invitation-card h1 {
                font-size: 2rem;
            }

            .invitation-card .name {
                font-size: 1.3rem;
            }

            .invitation-card .details {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="hint">Drag to explore</div>

    <div class="overlay">
        <div class="invitation-card">
            <h1>Happy Birthday</h1>
            <div class="name">You Are Cordially Invited</div>
            <div class="details">
                Saturday, December 28th at 7:00 PM<br>
                The Grand Ballroom<br>
                123 Celebration Avenue
            </div>
            <button class="rsvp-btn">RSVP Now</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';

        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 8;
        controls.maxPolarAngle = Math.PI * 0.75;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffd4a3, 1.5);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xe85a4f, 0.6);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const pointLight1 = new THREE.PointLight(0xffd700, 2, 20);
        pointLight1.position.set(5, 3, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff6b6b, 1.5, 20);
        pointLight2.position.set(-5, 2, -3);
        scene.add(pointLight2);

        // Background stars
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            const radius = 50 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);

            const colorChoice = Math.random();
            if (colorChoice < 0.33) {
                starColors[i * 3] = 1;
                starColors[i * 3 + 1] = 0.95;
                starColors[i * 3 + 2] = 0.8;
            } else if (colorChoice < 0.66) {
                starColors[i * 3] = 1;
                starColors[i * 3 + 1] = 0.85;
                starColors[i * 3 + 2] = 0.7;
            } else {
                starColors[i * 3] = 1;
                starColors[i * 3 + 1] = 1;
                starColors[i * 3 + 2] = 1;
            }

            starSizes[i] = Math.random() * 3 + 1;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('aColor', new THREE.BufferAttribute(starColors, 3));
        starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));

        const starMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() }
            },
            vertexShader: `
                attribute vec3 aColor;
                attribute float aSize;
                varying vec3 vColor;
                uniform float uTime;
                uniform float uPixelRatio;
                
                void main() {
                    vColor = aColor;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    float twinkle = sin(uTime * 2.0 + position.x * 0.1) * 0.5 + 0.5;
                    gl_PointSize = aSize * uPixelRatio * (200.0 / -mvPosition.z) * (0.5 + twinkle * 0.5);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                    gl_FragColor = vec4(vColor, alpha * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Balloon creation function
        function createBalloon(color, x, y, z) {
            const group = new THREE.Group();

            // Balloon body
            const balloonGeo = new THREE.SphereGeometry(1, 32, 32);
            balloonGeo.scale(0.8, 1.2, 0.8);

            const balloonMat = new THREE.MeshPhysicalMaterial({
                color: color,
                metalness: 0.1,
                roughness: 0.3,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: color,
                emissiveIntensity: 0.1
            });

            const balloon = new THREE.Mesh(balloonGeo, balloonMat);
            group.add(balloon);

            // Balloon knot
            const knotGeo = new THREE.ConeGeometry(0.12, 0.25, 16);
            const knotMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const knot = new THREE.Mesh(knotGeo, knotMat);
            knot.position.y = -1.25;
            group.add(knot);

            // String
            const stringCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -1.37, 0),
                new THREE.Vector3(0.1, -2, 0.05),
                new THREE.Vector3(-0.05, -2.8, -0.05),
                new THREE.Vector3(0.08, -3.5, 0.02)
            ]);
            const stringGeo = new THREE.TubeGeometry(stringCurve, 20, 0.02, 8, false);
            const stringMat = new THREE.MeshStandardMaterial({ color: 0xf5e6d3, roughness: 0.7 });
            const string = new THREE.Mesh(stringGeo, stringMat);
            group.add(string);

            group.position.set(x, y, z);
            group.userData = {
                baseY: y,
                speed: 0.5 + Math.random() * 0.5,
                offset: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.01
            };

            return group;
        }

        // Create balloons
        const balloonColors = [0xe85a4f, 0xf4a261, 0x2a9d8f, 0xe76f51, 0xf0c987, 0xd62839];
        const balloons = [];

        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const radius = 4 + Math.random() * 3;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = -1 + Math.random() * 4;
            const color = balloonColors[i % balloonColors.length];

            const balloon = createBalloon(color, x, y, z);
            balloon.scale.setScalar(0.9 + Math.random() * 0.4);
            balloons.push(balloon);
            scene.add(balloon);
        }

        // Confetti system
        const confettiCount = 500;
        const confettiGeometry = new THREE.BufferGeometry();
        const confettiPositions = new Float32Array(confettiCount * 3);
        const confettiVelocities = [];
        const confettiColors = new Float32Array(confettiCount * 3);
        const confettiRotations = new Float32Array(confettiCount);
        const confettiSizes = new Float32Array(confettiCount);

        const confettiColorPalette = [
            new THREE.Color(0xe85a4f),
            new THREE.Color(0xf4a261),
            new THREE.Color(0x2a9d8f),
            new THREE.Color(0xe76f51),
            new THREE.Color(0xf0c987),
            new THREE.Color(0xffffff),
            new THREE.Color(0xd62839)
        ];

        for (let i = 0; i < confettiCount; i++) {
            confettiPositions[i * 3] = (Math.random() - 0.5) * 40;
            confettiPositions[i * 3 + 1] = Math.random() * 30 - 5;
            confettiPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;

            confettiVelocities.push({
                x: (Math.random() - 0.5) * 0.03,
                y: -0.02 - Math.random() * 0.03,
                z: (Math.random() - 0.5) * 0.03
            });

            const color = confettiColorPalette[Math.floor(Math.random() * confettiColorPalette.length)];
            confettiColors[i * 3] = color.r;
            confettiColors[i * 3 + 1] = color.g;
            confettiColors[i * 3 + 2] = color.b;

            confettiRotations[i] = Math.random() * Math.PI * 2;
            confettiSizes[i] = Math.random() * 8 + 4;
        }

        confettiGeometry.setAttribute('position', new THREE.BufferAttribute(confettiPositions, 3));
        confettiGeometry.setAttribute('aConfettiColor', new THREE.BufferAttribute(confettiColors, 3));
        confettiGeometry.setAttribute('aRotation', new THREE.BufferAttribute(confettiRotations, 1));
        confettiGeometry.setAttribute('aConfettiSize', new THREE.BufferAttribute(confettiSizes, 1));

        const confettiMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                attribute vec3 aConfettiColor;
                attribute float aRotation;
                attribute float aConfettiSize;
                varying vec3 vConfettiColor;
                varying float vRotation;
                
                void main() {
                    vConfettiColor = aConfettiColor;
                    vRotation = aRotation;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = aConfettiSize * (150.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vConfettiColor;
                varying float vRotation;
                
                void main() {
                    vec2 center = gl_PointCoord - 0.5;
                    float s = sin(vRotation);
                    float c = cos(vRotation);
                    vec2 rotated = vec2(center.x * c - center.y * s, center.x * s + center.y * c);
                    
                    if (abs(rotated.x) > 0.4 || abs(rotated.y) > 0.25) discard;
                    
                    float edgeX = smoothstep(0.35, 0.4, abs(rotated.x));
                    float edgeY = smoothstep(0.2, 0.25, abs(rotated.y));
                    float alpha = 1.0 - max(edgeX, edgeY);
                    
                    gl_FragColor = vec4(vConfettiColor, alpha * 0.9);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const confetti = new THREE.Points(confettiGeometry, confettiMaterial);
        scene.add(confetti);

        // Gift box
        const giftGroup = new THREE.Group();

        const boxGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const boxMat = new THREE.MeshPhysicalMaterial({
            color: 0xc94c42,
            metalness: 0.2,
            roughness: 0.4,
            clearcoat: 0.5
        });
        const box = new THREE.Mesh(boxGeo, boxMat);
        giftGroup.add(box);

        // Ribbon horizontal
        const ribbonHGeo = new THREE.BoxGeometry(2.6, 0.4, 0.4);
        const ribbonMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 0.6,
            roughness: 0.2
        });
        const ribbonH = new THREE.Mesh(ribbonHGeo, ribbonMat);
        ribbonH.position.y = 0.1;
        giftGroup.add(ribbonH);

        // Ribbon vertical
        const ribbonVGeo = new THREE.BoxGeometry(0.4, 2.6, 0.4);
        const ribbonV = new THREE.Mesh(ribbonVGeo, ribbonMat);
        ribbonV.position.y = 0.1;
        giftGroup.add(ribbonV);

        // Bow
        const bowCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 1.5, 0),
            new THREE.Vector3(0.6, 2, 0.3),
            new THREE.Vector3(1, 1.7, 0),
            new THREE.Vector3(0.6, 1.4, 0)
        ]);
        const bowGeo = new THREE.TubeGeometry(bowCurve, 20, 0.15, 8, false);
        const bow1 = new THREE.Mesh(bowGeo, ribbonMat);
        giftGroup.add(bow1);

        const bow2 = bow1.clone();
        bow2.rotation.y = Math.PI;
        bow2.position.z = -0.1;
        giftGroup.add(bow2);

        giftGroup.position.set(0, -3, 2);
        giftGroup.rotation.y = Math.PI / 6;
        scene.add(giftGroup);

        // Sparkle particles around gift
        const sparkleCount = 100;
        const sparkleGeo = new THREE.BufferGeometry();
        const sparklePos = new Float32Array(sparkleCount * 3);
        const sparkleSpeeds = [];

        for (let i = 0; i < sparkleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 1.5 + Math.random() * 1;
            sparklePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            sparklePos[i * 3 + 1] = r * Math.cos(phi);
            sparklePos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            sparkleSpeeds.push(0.5 + Math.random());
        }

        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));

        const sparkleMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
            vertexShader: `
                uniform float uTime;
                uniform float uPixelRatio;
                varying float vAlpha;
                
                void main() {
                    vec3 pos = position;
                    float angle = uTime + length(position) * 2.0;
                    pos.x += sin(angle) * 0.2;
                    pos.y += cos(angle * 1.3) * 0.2;
                    pos.z += sin(angle * 0.7) * 0.2;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    vAlpha = sin(uTime * 3.0 + position.x * 5.0) * 0.5 + 0.5;
                    gl_PointSize = (8.0 + vAlpha * 8.0) * uPixelRatio * (100.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                
                void main() {
                    float dist = length(gl_PointCoord - 0.5);
                    if (dist > 0.5) discard;
                    float alpha = (1.0 - dist * 2.0) * vAlpha;
                    vec3 color = mix(vec3(1.0, 0.84, 0.0), vec3(1.0, 1.0, 1.0), vAlpha);
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
        sparkles.position.copy(giftGroup.position);
        scene.add(sparkles);

        // Load font and create 3D text
        const loader = new FontLoader();
        let textMesh = null;

        loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new TextGeometry('HAPPY BIRTHDAY', {
                font: font,
                size: 1.2,
                height: 0.3,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.03,
                bevelSize: 0.02,
                bevelOffset: 0,
                bevelSegments: 5
            });

            textGeo.center();

            const textMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd4a3,
                metalness: 0.3,
                roughness: 0.2,
                emissive: 0xff9944,
                emissiveIntensity: 0.2,
                clearcoat: 1,
                clearcoatRoughness: 0.1
            });

            textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.position.y = 5;
            scene.add(textMesh);
        });

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Update star material
            starMaterial.uniforms.uTime.value = time;

            // Animate balloons
            balloons.forEach((balloon) => {
                const data = balloon.userData;
                balloon.position.y = data.baseY + Math.sin(time * data.speed + data.offset) * 0.8;
                balloon.rotation.z = Math.sin(time * data.speed * 0.5 + data.offset) * 0.15;
                balloon.rotation.y += data.rotSpeed;
            });

            // Animate confetti
            const positions = confetti.geometry.attributes.position.array;
            const rotations = confetti.geometry.attributes.aRotation.array;

            for (let i = 0; i < confettiCount; i++) {
                positions[i * 3] += confettiVelocities[i].x + Math.sin(time + i) * 0.005;
                positions[i * 3 + 1] += confettiVelocities[i].y;
                positions[i * 3 + 2] += confettiVelocities[i].z + Math.cos(time + i) * 0.005;

                rotations[i] += 0.05;

                if (positions[i * 3 + 1] < -10) {
                    positions[i * 3 + 1] = 25;
                    positions[i * 3] = (Math.random() - 0.5) * 40;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
                }
            }

            confetti.geometry.attributes.position.needsUpdate = true;
            confetti.geometry.attributes.aRotation.needsUpdate = true;

            // Animate gift
            giftGroup.rotation.y = time * 0.3;
            giftGroup.position.y = -3 + Math.sin(time * 1.5) * 0.3;

            // Animate sparkles
            sparkleMat.uniforms.uTime.value = time;
            sparkles.position.copy(giftGroup.position);

            // Animate text
            if (textMesh) {
                textMesh.rotation.y = Math.sin(time * 0.5) * 0.1;
                textMesh.position.y = 5 + Math.sin(time * 0.8) * 0.3;
            }

            // Animate lights
            pointLight1.intensity = 2 + Math.sin(time * 2) * 0.5;
            pointLight2.intensity = 1.5 + Math.cos(time * 1.5) * 0.3;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            starMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
            sparkleMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        });

        // Button interaction
        document.querySelector('.rsvp-btn').addEventListener('click', function () {
            this.textContent = 'See You There!';
            this.style.background = 'linear-gradient(135deg, #2a9d8f 0%, #21867a 100%)';
            this.style.boxShadow = '0 8px 30px rgba(42,157,143,0.4)';

            // Burst effect - add more confetti
            for (let i = 0; i < 100; i++) {
                const idx = Math.floor(Math.random() * confettiCount);
                confettiPositions[idx * 3 + 1] = 20;
            }
        });
    </script>
</body>

</html>
