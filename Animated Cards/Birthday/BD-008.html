<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Birthday Party Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .invitation-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 50px;
            text-align: center;
            color: white;
            pointer-events: auto;
            animation: floatUp 2s ease-out forwards;
            opacity: 0;
            transform: translateY(50px);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            max-width: 500px;
            width: 90%;
        }

        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .invitation-card h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #FFD700, #FF69B4, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .invitation-card h2 {
            font-size: 1.3em;
            color: #FFD700;
            margin-bottom: 15px;
            font-weight: normal;
            font-style: italic;
        }

        .invitation-card .details {
            font-size: 1em;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
        }

        .invitation-card .details span {
            color: #FFD700;
            font-weight: bold;
        }

        .invitation-card .emoji-row {
            font-size: 1.5em;
            margin-top: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .title-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .title-overlay h1 {
            font-family: 'Georgia', serif;
            font-size: 3em;
            color: white;
            text-shadow:
                0 0 20px rgba(255, 105, 180, 0.8),
                0 0 40px rgba(255, 105, 180, 0.4),
                0 0 60px rgba(255, 215, 0, 0.3);
            animation: titleGlow 2s ease-in-out infinite alternate;
            opacity: 0;
            animation: titleAppear 1.5s ease-out forwards, titleGlow 2s ease-in-out infinite alternate 1.5s;
        }

        @keyframes titleAppear {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 105, 180, 0.4);
            }

            to {
                text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4), 0 0 80px rgba(255, 105, 180, 0.3);
            }
        }

        .hint {
            position: fixed;
            bottom: 10px;
            right: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8em;
            z-index: 10;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .invitation-card {
                padding: 20px 25px;
            }

            .invitation-card h1 {
                font-size: 1.6em;
            }

            .invitation-card h2 {
                font-size: 1.1em;
            }

            .title-overlay h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="title-overlay">
        <h1>🎉 You're Invited! 🎉</h1>
    </div>

    <div id="overlay">
        <div class="invitation-card">
            <h1>🎂 Happy Birthday! 🎂</h1>
            <h2>Sarah's 25th Birthday Bash</h2>
            <div class="details">
                <p>📅 <span>Saturday, December 28th, 2024</span></p>
                <p>🕖 <span>7:00 PM - 11:00 PM</span></p>
                <p>📍 <span>The Grand Ballroom, 123 Party Ave</span></p>
                <p>👗 <span>Dress Code: Cocktail Attire</span></p>
            </div>
            <div class="emoji-row">
                🎈 🎁 🎊 🥳 🎵
            </div>
        </div>
    </div>

    <div class="hint">🖱️ Drag to rotate • Scroll to zoom</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0015, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Background gradient
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 512;
        bgCanvas.height = 512;
        const bgCtx = bgCanvas.getContext('2d');
        const gradient = bgCtx.createRadialGradient(256, 256, 0, 256, 256, 400);
        gradient.addColorStop(0, '#1a0030');
        gradient.addColorStop(0.5, '#0d0020');
        gradient.addColorStop(1, '#050010');
        bgCtx.fillStyle = gradient;
        bgCtx.fillRect(0, 0, 512, 512);
        const bgTexture = new THREE.CanvasTexture(bgCanvas);
        scene.background = bgTexture;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333355, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const pinkLight = new THREE.PointLight(0xff69b4, 2, 20);
        pinkLight.position.set(-4, 5, 3);
        scene.add(pinkLight);

        const goldLight = new THREE.PointLight(0xffd700, 2, 20);
        goldLight.position.set(4, 5, -3);
        scene.add(goldLight);

        const purpleLight = new THREE.PointLight(0x9b59b6, 1.5, 15);
        purpleLight.position.set(0, 2, 5);
        scene.add(purpleLight);

        // Orbit Controls (manual implementation)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let cameraDistance = 10;
        let targetAngleX = 0;
        let targetAngleY = 0.3;
        let targetDistance = 10;

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                targetAngleX += deltaX * 0.005;
                targetAngleY = Math.max(-0.5, Math.min(1.2, targetAngleY + deltaY * 0.005));
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
        renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

        renderer.domElement.addEventListener('wheel', (e) => {
            targetDistance = Math.max(5, Math.min(20, targetDistance + e.deltaY * 0.01));
        });

        // Touch support
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                targetAngleX += deltaX * 0.005;
                targetAngleY = Math.max(-0.5, Math.min(1.2, targetAngleY + deltaY * 0.005));
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

        // Cake creation
        function createCake() {
            const cakeGroup = new THREE.Group();

            // Cake base plate
            const plateGeo = new THREE.CylinderGeometry(2.2, 2.4, 0.15, 32);
            const plateMat = new THREE.MeshPhysicalMaterial({
                color: 0xf5f5f5,
                metalness: 0.3,
                roughness: 0.2,
                clearcoat: 1.0
            });
            const plate = new THREE.Mesh(plateGeo, plateMat);
            plate.position.y = 0.075;
            plate.castShadow = true;
            plate.receiveShadow = true;
            cakeGroup.add(plate);

            // Cake layers
            const layers = [
                { radius: 1.8, height: 1.2, y: 0.75, color: 0xffb6c1, frostingColor: 0xffffff },
                { radius: 1.4, height: 1.0, y: 1.85, color: 0xffa0b4, frostingColor: 0xffe4e1 },
                { radius: 1.0, height: 0.8, y: 2.75, color: 0xff8da1, frostingColor: 0xfff0f5 }
            ];

            layers.forEach((layer, index) => {
                // Cake body
                const cakeGeo = new THREE.CylinderGeometry(layer.radius, layer.radius, layer.height, 32);
                const cakeMat = new THREE.MeshPhysicalMaterial({
                    color: layer.color,
                    roughness: 0.8,
                    metalness: 0.0
                });
                const cake = new THREE.Mesh(cakeGeo, cakeMat);
                cake.position.y = layer.y;
                cake.castShadow = true;
                cakeGroup.add(cake);

                // Frosting rim
                const frostingGeo = new THREE.TorusGeometry(layer.radius, 0.12, 8, 32);
                const frostingMat = new THREE.MeshPhysicalMaterial({
                    color: layer.frostingColor,
                    roughness: 0.3,
                    metalness: 0.1,
                    clearcoat: 0.5
                });
                const frosting = new THREE.Mesh(frostingGeo, frostingMat);
                frosting.position.y = layer.y + layer.height / 2;
                frosting.rotation.x = Math.PI / 2;
                cakeGroup.add(frosting);

                // Dripping frosting
                for (let d = 0; d < 8; d++) {
                    const angle = (d / 8) * Math.PI * 2 + index * 0.4;
                    const dripHeight = 0.3 + Math.random() * 0.4;
                    const dripGeo = new THREE.CylinderGeometry(0.08, 0.03, dripHeight, 8);
                    const drip = new THREE.Mesh(dripGeo, frostingMat.clone());
                    drip.position.set(
                        Math.cos(angle) * layer.radius,
                        layer.y + layer.height / 2 - dripHeight / 2,
                        Math.sin(angle) * layer.radius
                    );
                    cakeGroup.add(drip);
                }

                // Decorative dots
                if (index < 2) {
                    for (let dot = 0; dot < 12; dot++) {
                        const dotAngle = (dot / 12) * Math.PI * 2;
                        const dotGeo = new THREE.SphereGeometry(0.06, 8, 8);
                        const dotColors = [0xff69b4, 0xffd700, 0x87ceeb, 0xff6347, 0x98fb98];
                        const dotMat = new THREE.MeshPhysicalMaterial({
                            color: dotColors[dot % dotColors.length],
                            roughness: 0.5,
                            metalness: 0.3
                        });
                        const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                        dotMesh.position.set(
                            Math.cos(dotAngle) * (layer.radius + 0.05),
                            layer.y,
                            Math.sin(dotAngle) * (layer.radius + 0.05)
                        );
                        cakeGroup.add(dotMesh);
                    }
                }
            });

            // Candles
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const candleGroup = new THREE.Group();

                // Candle stick
                const candleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 8);
                const candleColors = [0xff6b6b, 0xfeca57, 0x48dbfb, 0xff9ff3, 0x54a0ff];
                const candleMat = new THREE.MeshPhysicalMaterial({
                    color: candleColors[i],
                    roughness: 0.7
                });
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.y = 0.3;
                candleGroup.add(candle);

                // Wick
                const wickGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.08, 4);
                const wickMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.y = 0.64;
                candleGroup.add(wick);

                // Flame (will be animated)
                const flameGeo = new THREE.ConeGeometry(0.06, 0.15, 8);
                const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.position.y = 0.74;
                flame.userData.isFlame = true;
                flame.userData.baseY = 0.74;
                candleGroup.add(flame);

                // Flame glow
                const glowGeo = new THREE.SphereGeometry(0.08, 8, 8);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xff8800,
                    transparent: true,
                    opacity: 0.6
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.y = 0.74;
                glow.userData.isGlow = true;
                candleGroup.add(glow);

                // Point light for each candle
                const candleLight = new THREE.PointLight(0xffaa00, 0.5, 3);
                candleLight.position.y = 0.8;
                candleGroup.add(candleLight);

                candleGroup.position.set(
                    Math.cos(angle) * 0.5,
                    3.15,
                    Math.sin(angle) * 0.5
                );
                cakeGroup.add(candleGroup);
            }

            // Happy Birthday text on cake
            // Using simple colored spheres as sprinkles
            for (let s = 0; s < 30; s++) {
                const sprinkleGeo = new THREE.BoxGeometry(0.04, 0.12, 0.04);
                const sprinkleColors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500];
                const sprinkleMat = new THREE.MeshPhysicalMaterial({
                    color: sprinkleColors[s % sprinkleColors.length],
                    roughness: 0.4,
                    metalness: 0.2
                });
                const sprinkle = new THREE.Mesh(sprinkleGeo, sprinkleMat);
                const layerIdx = Math.floor(Math.random() * 3);
                const layerData = layers[layerIdx];
                const sprAngle = Math.random() * Math.PI * 2;
                const sprRadius = Math.random() * (layerData.radius - 0.2);
                sprinkle.position.set(
                    Math.cos(sprAngle) * sprRadius,
                    layerData.y + layerData.height / 2 + 0.06,
                    Math.sin(sprAngle) * sprRadius
                );
                sprinkle.rotation.set(Math.random(), Math.random(), Math.random());
                cakeGroup.add(sprinkle);
            }

            return cakeGroup;
        }

        const cake = createCake();
        scene.add(cake);

        // Table
        function createTable() {
            const tableGroup = new THREE.Group();

            const tableTopGeo = new THREE.CylinderGeometry(3, 3, 0.15, 32);
            const tableMat = new THREE.MeshPhysicalMaterial({
                color: 0x8B4513,
                roughness: 0.6,
                metalness: 0.1
            });
            const tableTop = new THREE.Mesh(tableTopGeo, tableMat);
            tableTop.position.y = -0.1;
            tableTop.receiveShadow = true;
            tableGroup.add(tableTop);

            // Table leg
            const legGeo = new THREE.CylinderGeometry(0.2, 0.3, 2, 8);
            const leg = new THREE.Mesh(legGeo, tableMat);
            leg.position.y = -1.15;
            leg.castShadow = true;
            tableGroup.add(leg);

            // Base
            const baseGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32);
            const base = new THREE.Mesh(baseGeo, tableMat);
            base.position.y = -2.15;
            base.receiveShadow = true;
            tableGroup.add(base);

            return tableGroup;
        }

        const table = createTable();
        scene.add(table);

        // Balloons
        const balloons = [];
        function createBalloon(color, x, y, z, scale = 1) {
            const balloonGroup = new THREE.Group();

            // Balloon body
            const balloonGeo = new THREE.SphereGeometry(0.5 * scale, 16, 16);
            balloonGeo.scale(1, 1.3, 1);
            const balloonMat = new THREE.MeshPhysicalMaterial({
                color: color,
                roughness: 0.2,
                metalness: 0.1,
                clearcoat: 0.8,
                transparent: true,
                opacity: 0.9
            });
            const balloon = new THREE.Mesh(balloonGeo, balloonMat);
            balloonGroup.add(balloon);

            // Knot
            const knotGeo = new THREE.ConeGeometry(0.06 * scale, 0.12 * scale, 8);
            const knotMat = new THREE.MeshPhysicalMaterial({ color: color, roughness: 0.5 });
            const knot = new THREE.Mesh(knotGeo, knotMat);
            knot.position.y = -0.65 * scale;
            knot.rotation.x = Math.PI;
            balloonGroup.add(knot);

            // String
            const stringCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.7 * scale, 0),
                new THREE.Vector3(0.1, -1.5 * scale, 0.1),
                new THREE.Vector3(-0.1, -2.2 * scale, -0.1),
                new THREE.Vector3(0, -3 * scale, 0)
            ]);
            const stringGeo = new THREE.TubeGeometry(stringCurve, 20, 0.01, 4, false);
            const stringMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            const string = new THREE.Mesh(stringGeo, stringMat);
            balloonGroup.add(string);

            balloonGroup.position.set(x, y, z);
            balloonGroup.userData = {
                baseY: y,
                baseX: x,
                baseZ: z,
                speed: 0.3 + Math.random() * 0.5,
                phase: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.5 + Math.random() * 0.5
            };

            return balloonGroup;
        }

        const balloonColors = [0xff6b6b, 0xfeca57, 0x48dbfb, 0xff9ff3, 0x54a0ff, 0x5f27cd, 0xff6348, 0x2ed573];
        const balloonPositions = [
            { x: -4, y: 5, z: -2 },
            { x: 4.5, y: 6, z: -1 },
            { x: -3, y: 4.5, z: 3 },
            { x: 3, y: 5.5, z: 2 },
            { x: -5, y: 6.5, z: 0 },
            { x: 5, y: 4, z: -3 },
            { x: -2, y: 7, z: -4 },
            { x: 2, y: 5, z: 4 },
            { x: -4.5, y: 3.5, z: -3 },
            { x: 3.5, y: 7, z: -2 },
            { x: -1, y: 6, z: 5 },
            { x: 0, y: 8, z: -3 }
        ];

        balloonPositions.forEach((pos, i) => {
            const balloon = createBalloon(
                balloonColors[i % balloonColors.length],
                pos.x, pos.y, pos.z,
                0.7 + Math.random() * 0.5
            );
            scene.add(balloon);
            balloons.push(balloon);
        });

        // Confetti particles
        const confettiCount = 500;
        const confettiGeo = new THREE.BufferGeometry();
        const confettiPositions = new Float32Array(confettiCount * 3);
        const confettiColors = new Float32Array(confettiCount * 3);
        const confettiVelocities = [];
        const confettiRotations = [];

        const colorPalette = [
            new THREE.Color(0xff6b6b),
            new THREE.Color(0xfeca57),
            new THREE.Color(0x48dbfb),
            new THREE.Color(0xff9ff3),
            new THREE.Color(0x54a0ff),
            new THREE.Color(0xffd700),
            new THREE.Color(0xff69b4),
            new THREE.Color(0x00ff88)
        ];

        for (let i = 0; i < confettiCount; i++) {
            confettiPositions[i * 3] = (Math.random() - 0.5) * 20;
            confettiPositions[i * 3 + 1] = Math.random() * 15;
            confettiPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;

            const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            confettiColors[i * 3] = color.r;
            confettiColors[i * 3 + 1] = color.g;
            confettiColors[i * 3 + 2] = color.b;

            confettiVelocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: -0.01 - Math.random() * 0.02,
                z: (Math.random() - 0.5) * 0.02
            });

            confettiRotations.push({
                x: Math.random() * Math.PI * 2,
                y: Math.random() * Math.PI * 2,
                speed: 0.02 + Math.random() * 0.05
            });
        }

        confettiGeo.setAttribute('position', new THREE.BufferAttribute(confettiPositions, 3));
        confettiGeo.setAttribute('color', new THREE.BufferAttribute(confettiColors, 3));

        const confettiMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });

        const confetti = new THREE.Points(confettiGeo, confettiMat);
        scene.add(confetti);

        // Star particles (background)
        const starCount = 200;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const r = 25 + Math.random() * 20;
            starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = r * Math.cos(phi);
            starSizes[i] = Math.random() * 3 + 1;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.1,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Gift boxes
        function createGiftBox(color, ribbonColor, size, x, z) {
            const giftGroup = new THREE.Group();

            // Box
            const boxGeo = new THREE.BoxGeometry(size, size, size);
            const boxMat = new THREE.MeshPhysicalMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.1,
                clearcoat: 0.3
            });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.y = size / 2;
            box.castShadow = true;
            giftGroup.add(box);

            // Lid
            const lidGeo = new THREE.BoxGeometry(size + 0.05, size * 0.15, size + 0.05);
            const lidMat = new THREE.MeshPhysicalMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.2,
                clearcoat: 0.5
            });
            const lid = new THREE.Mesh(lidGeo, lidMat);
            lid.position.y = size + size * 0.075;
            giftGroup.add(lid);

            // Ribbon horizontal
            const ribbonHGeo = new THREE.BoxGeometry(size + 0.06, size * 0.12, 0.08);
            const ribbonMat = new THREE.MeshPhysicalMaterial({
                color: ribbonColor,
                roughness: 0.3,
                metalness: 0.4,
                clearcoat: 0.8
            });
            const ribbonH = new THREE.Mesh(ribbonHGeo, ribbonMat);
            ribbonH.position.y = size / 2;
            giftGroup.add(ribbonH);

            // Ribbon vertical
            const ribbonVGeo = new THREE.BoxGeometry(0.08, size * 0.12, size + 0.06);
            const ribbonV = new THREE.Mesh(ribbonVGeo, ribbonMat);
            ribbonV.position.y = size / 2;
            giftGroup.add(ribbonV);

            // Bow
            const bowGeo = new THREE.TorusGeometry(size * 0.15, 0.04, 8, 16);
            const bow1 = new THREE.Mesh(bowGeo, ribbonMat);
            bow1.position.set(-size * 0.1, size + size * 0.2, 0);
            bow1.rotation.y = Math.PI / 4;
            giftGroup.add(bow1);

            const bow2 = new THREE.Mesh(bowGeo, ribbonMat);
            bow2.position.set(size * 0.1, size + size * 0.2, 0);
            bow2.rotation.y = -Math.PI / 4;
            giftGroup.add(bow2);

            giftGroup.position.set(x, 0, z);
            return giftGroup;
        }

        const gift1 = createGiftBox(0xe74c3c, 0xf1c40f, 0.6, -3, -1.5);
        const gift2 = createGiftBox(0x3498db, 0xe74c3c, 0.5, -2.5, -2.5);
        const gift3 = createGiftBox(0xf1c40f, 0xe74c3c, 0.7, 3.2, -1.8);
        const gift4 = createGiftBox(0x2ecc71, 0xff69b4, 0.45, 2.5, -2.8);
        scene.add(gift1, gift2, gift3, gift4);

        // Floor with pattern
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshPhysicalMaterial({
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2.2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Sparkle ring around cake
        const sparkleRingCount = 50;
        const sparkleRingGeo = new THREE.BufferGeometry();
        const sparkleRingPositions = new Float32Array(sparkleRingCount * 3);
        const sparkleRingColors = new Float32Array(sparkleRingCount * 3);

        for (let i = 0; i < sparkleRingCount; i++) {
            const angle = (i / sparkleRingCount) * Math.PI * 2;
            sparkleRingPositions[i * 3] = Math.cos(angle) * 2.5;
            sparkleRingPositions[i * 3 + 1] = 0.5;
            sparkleRingPositions[i * 3 + 2] = Math.sin(angle) * 2.5;

            const sparkleColor = new THREE.Color().setHSL(i / sparkleRingCount, 1, 0.7);
            sparkleRingColors[i * 3] = sparkleColor.r;
            sparkleRingColors[i * 3 + 1] = sparkleColor.g;
            sparkleRingColors[i * 3 + 2] = sparkleColor.b;
        }

        sparkleRingGeo.setAttribute('position', new THREE.BufferAttribute(sparkleRingPositions, 3));
        sparkleRingGeo.setAttribute('color', new THREE.BufferAttribute(sparkleRingColors, 3));

        const sparkleRingMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true
        });

        const sparkleRing = new THREE.Points(sparkleRingGeo, sparkleRingMat);
        scene.add(sparkleRing);

        // Floating 3D text (using simple geometry)
        function createFloatingStar(size, x, y, z) {
            const starShape = new THREE.Shape();
            const outerRadius = size;
            const innerRadius = size * 0.4;
            const points = 5;

            for (let i = 0; i < points * 2; i++) {
                const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) {
                    starShape.moveTo(x, y);
                } else {
                    starShape.lineTo(x, y);
                }
            }
            starShape.closePath();

            const extrudeSettings = { depth: size * 0.3, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02 };
            const starGeo = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
            const starMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                roughness: 0.2,
                metalness: 0.8,
                clearcoat: 1.0,
                emissive: 0xffd700,
                emissiveIntensity: 0.2
            });
            const star = new THREE.Mesh(starGeo, starMat);
            star.position.set(x, y, z);
            star.castShadow = true;
            return star;
        }

        const floatingStars = [];
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const radius = 5 + Math.random() * 2;
            const star = createFloatingStar(
                0.15 + Math.random() * 0.2,
                Math.cos(angle) * radius,
                2 + Math.random() * 4,
                Math.sin(angle) * radius
            );
            scene.add(star);
            floatingStars.push({
                mesh: star,
                baseY: star.position.y,
                speed: 0.5 + Math.random() * 0.5,
                phase: Math.random() * Math.PI * 2,
                rotSpeed: 0.5 + Math.random() * 1
            });
        }

        // Musical notes floating
        function createMusicNote(x, y, z) {
            const noteGroup = new THREE.Group();

            // Note head
            const headGeo = new THREE.SphereGeometry(0.12, 8, 8);
            headGeo.scale(1.2, 1, 0.8);
            const noteMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                roughness: 0.3,
                metalness: 0.5,
                emissive: 0xffd700,
                emissiveIntensity: 0.3
            });
            const head = new THREE.Mesh(headGeo, noteMat);
            noteGroup.add(head);

            // Stem
            const stemGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.5, 4);
            const stem = new THREE.Mesh(stemGeo, noteMat);
            stem.position.set(0.1, 0.25, 0);
            noteGroup.add(stem);

            // Flag
            const flagGeo = new THREE.PlaneGeometry(0.15, 0.2);
            const flag = new THREE.Mesh(flagGeo, noteMat);
            flag.position.set(0.18, 0.45, 0);
            flag.rotation.y = 0.3;
            noteGroup.add(flag);

            noteGroup.position.set(x, y, z);
            return noteGroup;
        }

        const musicNotes = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + Math.PI / 3;
            const note = createMusicNote(
                Math.cos(angle) * 6,
                3 + Math.random() * 3,
                Math.sin(angle) * 6
            );
            scene.add(note);
            musicNotes.push({
                mesh: note,
                baseY: note.position.y,
                speed: 0.3 + Math.random() * 0.4,
                phase: Math.random() * Math.PI * 2,
                bobSpeed: 1 + Math.random()
            });
        }

        // Hat on table
        function createPartyHat() {
            const hatGroup = new THREE.Group();

            const hatGeo = new THREE.ConeGeometry(0.4, 1, 16);
            const hatMat = new THREE.MeshPhysicalMaterial({
                color: 0xff6b6b,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const hat = new THREE.Mesh(hatGeo, hatMat);
            hat.position.y = 0.5;

            // Add stripes
            const stripeCanvas = document.createElement('canvas');
            stripeCanvas.width = 256;
            stripeCanvas.height = 256;
            const sCtx = stripeCanvas.getContext('2d');
            sCtx.fillStyle = '#ff6b6b';
            sCtx.fillRect(0, 0, 256, 256);
            sCtx.fillStyle = '#feca57';
            for (let stripe = 0; stripe < 8; stripe++) {
                sCtx.fillRect(0, stripe * 32, 256, 16);
            }
            const stripeTexture = new THREE.CanvasTexture(stripeCanvas);
            hatMat.map = stripeTexture;

            hatGroup.add(hat);

            // Pom pom
            const pomGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const pomMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 1 });
            const pom = new THREE.Mesh(pomGeo, pomMat);
            pom.position.y = 1.05;
            hatGroup.add(pom);

            // Brim
            const brimGeo = new THREE.TorusGeometry(0.42, 0.05, 8, 16);
            const brimMat = new THREE.MeshPhysicalMaterial({ color: 0xfeca57, roughness: 0.4, metalness: 0.3 });
            const brim = new THREE.Mesh(brimGeo, brimMat);
            brim.rotation.x = Math.PI / 2;
            hatGroup.add(brim);

            hatGroup.position.set(1.5, 0, 0.8);
            hatGroup.rotation.z = -0.3;
            return hatGroup;
        }

        const partyHat = createPartyHat();
        scene.add(partyHat);

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Smooth camera
            cameraAngleX += (targetAngleX - cameraAngleX) * 0.05;
            cameraAngleY += (targetAngleY - cameraAngleY) * 0.05;
            cameraDistance += (targetDistance - cameraDistance) * 0.05;

            // Auto rotate slowly
            if (!isDragging) {
                targetAngleX += 0.001;
            }

            camera.position.x = Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
            camera.position.y = Math.sin(cameraAngleY) * cameraDistance + 3;
            camera.position.z = Math.cos(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
            camera.lookAt(0, 1.5, 0);

            // Animate balloons
            balloons.forEach(balloon => {
                const data = balloon.userData;
                balloon.position.y = data.baseY + Math.sin(time * data.speed + data.phase) * 0.3;
                balloon.position.x = data.baseX + Math.sin(time * data.wobbleSpeed + data.phase) * 0.2;
                balloon.position.z = data.baseZ + Math.cos(time * data.wobbleSpeed + data.phase + 1) * 0.2;
                balloon.rotation.z = Math.sin(time * data.wobbleSpeed + data.phase) * 0.1;
            });

            // Animate confetti
            const positions = confettiGeo.attributes.position.array;
            for (let i = 0; i < confettiCount; i++) {
                positions[i * 3] += confettiVelocities[i].x;
                positions[i * 3 + 1] += confettiVelocities[i].y;
                positions[i * 3 + 2] += confettiVelocities[i].z;

                // Add waviness
                positions[i * 3] += Math.sin(time * 2 + i) * 0.003;
                positions[i * 3 + 2] += Math.cos(time * 2 + i) * 0.003;

                // Reset confetti that falls below
                if (positions[i * 3 + 1] < -3) {
                    positions[i * 3] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 1] = 12 + Math.random() * 5;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
                }
            }
            confettiGeo.attributes.position.needsUpdate = true;

            // Animate candle flames
            cake.traverse(child => {
                if (child.userData.isFlame) {
                    child.position.y = child.userData.baseY + Math.sin(time * 8 + child.id) * 0.02;
                    child.scale.x = 1 + Math.sin(time * 10 + child.id) * 0.2;
                    child.scale.z = 1 + Math.cos(time * 10 + child.id) * 0.2;
                }
                if (child.userData.isGlow) {
                    child.scale.setScalar(1 + Math.sin(time * 6 + child.id) * 0.3);
                }
            });

            // Animate floating stars
            floatingStars.forEach(star => {
                star.mesh.position.y = star.baseY + Math.sin(time * star.speed + star.phase) * 0.5;
                star.mesh.rotation.y += star.rotSpeed * 0.02;
                star.mesh.rotation.x = Math.sin(time * 0.5 + star.phase) * 0.3;
            });

            // Animate music notes
            musicNotes.forEach(note => {
                note.mesh.position.y = note.baseY + Math.sin(time * note.bobSpeed + note.phase) * 0.4;
                note.mesh.rotation.y += 0.01;
                note.mesh.rotation.z = Math.sin(time * note.speed + note.phase) * 0.2;
            });

            // Animate sparkle ring
            const sparklePositions = sparkleRingGeo.attributes.position.array;
            for (let i = 0; i < sparkleRingCount; i++) {
                const angle = (i / sparkleRingCount) * Math.PI * 2 + time * 0.5;
                const radius = 2.5 + Math.sin(time * 2 + i * 0.5) * 0.3;
                sparklePositions[i * 3] = Math.cos(angle) * radius;
                sparklePositions[i * 3 + 1] = 0.5 + Math.sin(time * 3 + i * 0.3) * 0.5;
                sparklePositions[i * 3 + 2] = Math.sin(angle) * radius;
            }
            sparkleRingGeo.attributes.position.needsUpdate = true;

            // Rotate stars slowly
            stars.rotation.y += 0.0002;

            // Gentle cake bobbing
            cake.position.y = Math.sin(time * 0.5) * 0.05;

            // Animate lights
            pinkLight.intensity = 2 + Math.sin(time * 2) * 0.5;
            goldLight.intensity = 2 + Math.cos(time * 2.5) * 0.5;
            purpleLight.intensity = 1.5 + Math.sin(time * 3) * 0.3;

            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Click interaction - burst confetti
        renderer.domElement.addEventListener('click', (e) => {
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );

            // Flash effect
            const flashLight = new THREE.PointLight(0xffffff, 5, 10);
            flashLight.position.copy(camera.position);
            scene.add(flashLight);

            setTimeout(() => {
                scene.remove(flashLight);
            }, 100);
        });
    </script>
</body>

</html>
